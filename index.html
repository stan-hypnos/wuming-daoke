/* ===== 工具 ===== */
function addLog(s,c){
  if(!G) return;
  G.log.push({s,c:c||''});
  if(G.log.length>90) G.log.shift();
  const el = document.getElementById('log');
  if(el){
    el.innerHTML = G.log.map(l=>`<p class="${l.c}">${l.s}</p>`).join('');
    el.scrollTop = el.scrollHeight;
  }
}
function clearLog(){ if(G){ G.log=[]; const el=document.getElementById('log'); if(el) el.innerHTML=''; } }
function tileAt(x,y){ return (x<0||y<0||x>=GW||y>=GH) ? 1 : G.tiles[y][x]; }
function mobAt(x,y){ return G.mobs.find(m=>!m.dead && m.x===x && m.y===y); }
function propAt(x,y){ return G.props.find(p=>p.x===x && p.y===y); }
function walkable(x,y){
  const t = tileAt(x,y);
  if(t===1||t===6||t===T_BARREL||t===T_ROCK) return false;
  return true;
}
/* 地形对战斗的影响 */
function tileMods(x,y){
  if(!G || !G.tiles || !G.tiles[y]) return {move:0, hit:0, dmg:0, cover:0, high:0};
  const t = tileAt(x,y);
  const mod = {move:0, hit:0, dmg:0, cover:0, high:0};
  if(t===2){ mod.move = 1; mod.hit = -0.10; }        // 深水：慢、飘
  if(t===T_SHALLOW){ mod.move = 0.5; }
  if(t===T_HIGH){ mod.high = 1; mod.hit = 0.12; mod.dmg = 1.1; }
  if(t===3){ mod.cover = 0.10; }
  let adjCover = 0;
  for(const [dx,dy] of R4){
    const n = tileAt(x+dx,y+dy);
    if(n===1||n===T_ROCK||n===T_BARREL) adjCover += 0.12;
  }
  mod.cover = Math.min(0.45, mod.cover + adjCover);
  return mod;
}

/* ===== 玩家移动 ===== */
function movePlayer(dx,dy){
  if(!G || G.over || UI.mode==='aim') return;
  const nx = G.px+dx, ny = G.py+dy;
  if(!walkable(nx,ny)) return;
  if(mobAt(nx,ny)) return;
  if(tileAt(nx,ny)===T_DOOR){
    G.tiles[ny][nx]=0;
    addLog('推开了门。','');
  }
  G.px=nx; G.py=ny;
  if(tileAt(nx,ny)===T_SHALLOW) run.st = clamp(run.st-1,0,run.stmax);
  if(tileAt(nx,ny)===2) run.st = clamp(run.st-2,0,run.stmax);
  if(tileAt(nx,ny)===T_TRAP){
    const dm = 6 + rand(8);
    run.hp -= dm;
    G.tiles[ny][nx] = 0;
    addLog('脚下崩了一下——是猎户的套索。-' + dm, 'r');
    G.alarm = clamp(G.alarm+1,0,4);
  }
  if(tileAt(nx,ny)===T_BOAT) addLog('踏上船板，水声盖住了脚步。','');
  run.movedThisTurn = true;
  const wsMove = gearStats('weapon');
  if(wsMove && wsMove.moveCost) run.st = clamp(run.st - wsMove.moveCost, 0, run.stmax);

  // 脚下有东西就捡起来
  G.items.forEach(it=>{
    if(it.taken || it.x!==nx || it.y!==ny || it.dead) return;
    it.taken = true;
    if(it.isEscort){
      addLog('接上了要送的人。带上他，往出口走。','g');
    } else {
      addLog('取到了 '+it.name+'。','g');
    }
  });

  if(tileAt(nx,ny)===5){
    G.atExit = true;
    addLog('到了出口。按 G 撤离，或继续留下。','g');
  } else G.atExit = false;
  if(tileAt(nx,ny)===2) run.st = clamp(run.st-3,0,run.stmax);
  if(tileAt(nx,ny)===3) run.hidden = false;
  if(run.hidden){
    const tooClose = G.mobs.some(m=>!m.dead && m.rel==='hostile' && dist(m.x,m.y,nx,ny)<=1);
    if(tooClose){ run.hidden=false; addLog('贴得太近，藏不住了。',''); }
  }
  endTurn();
}

/* ===== 攻击 ===== */
const CRIT_BASE = { dagger:0.08, spear:0.15, bow:0.12 };

function gearStats(slot){
  if(!run || !run.equip) return null;
  return instStats(run.equip[slot]);
}
function gearAtk(){ const s=gearStats('weapon'); return s?s.atk:0; }
function gearDef(){ const s=gearStats('armor');  return s?s.def:0; }
function gearEva(){
  const w=gearStats('weapon'), a2=gearStats('armor');
  return (w?w.eva:0) + (a2?a2.eva:0);
}
function gearHp(){ const s=gearStats('armor'); return s?s.hp:0; }
function pAtk(){ return (run.atk||0) + gearAtk(); }
function pDef(){ return (run.def||0) + gearDef() + (run.gateBonus||0); }
function pEva(){ return (run.eva||0) + gearEva(); }

function recalcGear(){
  if(!run) return;
  const base = (typeof run.basehp==='number') ? run.basehp : run.maxhp;
  run.maxhp = base + gearHp();
  if(run.hp > run.maxhp) run.hp = run.maxhp;
}

/* 这一击的暴击几率 —— 刺客 8%，潜行 35%，长兵 15%，弓手 12% */
function critChance(){
  let c = CRIT_BASE[run.cls] || 0.08;
  if(run.cls==='dagger' && run.hidden) c = 0.35;
  if(run.shadowCrit) c += 0.25;
  if(run.aimCrit)    c += 0.15;
  if(run.braceCrit)  c += 0.10;
  return clamp(c, 0.02, 0.95);
}

/* 一次挥刀。mult 是倍率，basic=true 表示普通攻击（不吃任何资源惩罚）
   命中与暴击是两次独立的判定：先看打不打得到，再看是不是要害。 */
function playerAttack(m, mult, silent, basic){
  if(!m) return false;
  if(m.rel==='neutral'){
    m.rel='hostile'; m.alert=true;
    addLog(m.name+' 被你这一刀逼成了敌人。','r');
  }
  const ws = gearStats('weapon');
  const hidden = (run.cls==='dagger' && run.hidden);
  const pierce = Math.max((ws?ws.ignoreDef:0), run._pierce||0);
  const defEff = Math.max(0, Math.round((m.def||0) * (1 - pierce)));
  const am = tileMods(G.px,G.py), tm = tileMods(m.x,m.y);
  const ranged = dist(G.px,G.py,m.x,m.y) > 1;
  const coverPen = tm.cover * (ranged ? 1 : 0.35);
  const hitChance = clamp(0.58 + (pAtk()-defEff)/80 + (hidden?0.22:0) - (m.eva||0)/100
                          + am.hit - coverPen + (tm.high?-0.05:0), 0.15, 0.95);

  const hit = Math.random() < hitChance;            // 先判命中
  const crit = hit && Math.random() < critChance();  // 打中了才可能暴击

  if(hit){
    let dmg = Math.max(1, pAtk() + run.lv*1.6 - defEff + rand(5));
    dmg = dmg * (mult||1) * (run._rb||1) * (run.brace?1.5:1) * (crit?1.8:1) * (ws?ws.dmgMul:1);
    if(run._comboShot) dmg *= (1 + run._comboShot);
    if(ws && ws.comboDmg){
      run._shot = (run._shot||0) + 1;
      dmg *= (1 + ws.comboDmg * run._shot);
    }
    dmg = Math.max(1, Math.round(dmg));
    m.hp -= dmg;
    m.hitT = nowT();
    pushFx(m.x, m.y, '-'+dmg, crit?'crit':'dmg');
    if(crit){ G.shake = nowT(); sfx('crit'); } else sfx('hit');
    addLog(m.name + (crit?' 要害命中':' 中刀') + `  -${dmg}`, crit?'y':'');
    if(run.cls==='spear') run.res = clamp(run.res+6,0,run.resMax);
    if(hidden) run.res = clamp(run.res+8,0,run.resMax);
    if(ws && ws.burn){ m.bleed = Math.max(m.bleed||0, ws.burn); m.bleedT = Math.max(m.bleedT||0, 2); }
    if(ws && ws.cdCut && Math.random()<0.3){ Object.keys(run.cd).forEach(k=>{ if(run.cd[k]>0) run.cd[k]--; }); addLog('刀势未歇。','y'); }
    if(m.rel!=='hostile'){
      m.rel='hostile';
      addLog(m.name+' 记下了这一刀——他把你当敌人了。','r');
    }
    if(m.hp<=0){
      m.dead=true; run.kills++;
      noteBossKill(m);
      addLog(m.name+' 倒下。','g');
      if(m.boss) toast('斩 · '+m.name, true);
      sfx('win');
      if(ws && ws.killHeal) run.hp = clamp(run.hp+ws.killHeal,0,run.maxhp);
      G.alarm=clamp(G.alarm+2,0,4);
      addExp((m.exp||1)*10 + (m.lv||1)*3);
      dropLoot(m);
    }
  } else {
    pushFx(m.x, m.y, '落空', 'miss');
    addLog('落空了。','r');
    if(run.cls==='spear' && !basic) run.res = clamp(run.res-10,0,run.resMax);
  }
  if(run.brace) run.brace = 0;      // 蓄势只兑现一次
  run._comboShot = 0;
  run.braceCrit = 0; run.aimCrit = 0; run.shadowCrit = 0;
  run.hidden = false;
  return true;
}

/*
  普通攻击：不耗暗劲、不耗体力、不耗士气。
  这是你的底子——所有手段都建立在它之上。
*/
function basicAttack(m){
  if(!m) return false;
  if(m.rel === 'ally'){ addLog('这一刀砍不下去。','r'); return false; }
  if(dist(G.px,G.py,m.x,m.y) > atkRange()){ addLog('够不着。','r'); return false; }
  if(run.cls==='bow' && !lineOfSight(G.px,G.py,m.x,m.y,G.tiles)){ addLog('没有射界。','r'); return false; }
  playerAttack(m, 1.0, false, true);
  run.hidden = false;
  endTurn();
  return true;
}

function atkRange(){
  const ws = gearStats('weapon');
  const extra = ws ? ws.range : 0;
  return (run.cls==='bow' ? 6 : 1) + extra;
}

const MAXBAG = 10;

const BOSSDROP = {huaxiong:'huadao', lvbu:'fangtian', dongzhuo:'dongarmor'};
function dropLoot(m){
  if(m.boss){
    if(!run.items) run.items = [];
    const id = BOSSDROP[m.boss];
    if(id && run.items.length < MAXBAG){
      run.items.push(gearFor(id, m.lv||8));
      metaAddMany('gear',[id]);
      addLog('从他身上取下 '+ITEMS[id].name+'。','y');
    } else if(id) addLog(ITEMS[id].name+' 太重，背囊塞不下了。','r');
    return;
  }
  const chance = m.type==='boss' ? 1 : m.type==='elite' ? 0.55 : 0.14;
  if(Math.random() > chance) return;
  if(!run.items) run.items = [];
  if(run.items.length >= MAXBAG){ addLog('背囊满了，只能眼睁睁看着。','r'); return; }
  const pool = m.type==='boss'    ? ['changdao','armor3','med','pill'] :
               m.type==='elite'   ? ['dao','armor2','med','oil'] :
                                    ['med','food','oil','armor1','pill','dao'];
  const id = pick(pool);
  const it = ITEMS[id];
  if(it && (it.type==='weapon' || it.type==='armor')){
    run.items.push(gearFor(id, m.lv||1));
    metaAddMany('gear',[id]);
    addLog('拾得一件器物。','g');
  } else {
    run.items.push(id);
    addLog('拾得 '+ITEMS[id].name+'。','g');
  }
}

function useSkill(id, tx, ty){
  const sk = SKILLS[id];
  if(!sk || !run.skills.includes(id)) return false;
  if((run.cd[id]||0) > 0){ addLog('这一手还没缓过来。','r'); return false; }
  if(run.st < sk.st){ addLog('体力不够。','r'); return false; }
  if(run.res < sk.res){ addLog(run.resName+'不够。','r'); return false; }

  const d = dist(G.px,G.py,tx,ty);
  let ok = true;
  switch(sk.target){
    case 'enemy': { const m = mobAt(tx,ty); if(!m || d>sk.range) ok=false; break; }
    case 'tile':  if(d>sk.range || tileAt(tx,ty)===1) ok=false; break;
    case 'adj':   if(d!==1) ok=false; break;
    case 'self':  break;
    case 'dir':   break;
  }
  if(!ok){ addLog('打不到那里。','r'); return false; }

  if(id==='ignite'){
    const p = propAt(tx,ty);
    if(!p || p.kind!=='grain' || p.burning>0){ addLog('这里点不着。','r'); return false; }
  }
  if(id==='hide'){
    const watched = G.mobs.some(m=>!m.dead && m.rel==='hostile' && m.alert && canEnemySee(m));
    if(watched){ addLog('有人正看着你，藏不住。','r'); return false; }
  }
  if(id==='backstab' && !mobAt(tx,ty)){ addLog('那儿没人。','r'); return false; }

  run.st -= sk.st;
  run.res -= sk.res;
  if(sk.cd>0) run.cd[id] = sk.cd;
  run._rb = 1 + 0.05*brLv(id);
  const A = mch(id,'a'), B = mch(id,'b');

  switch(id){
    case 'backstab': {
      const m = mobAt(tx,ty);
      if(m){
        const unaware = (!m.alert || run.hidden);
        let mult = unaware ? 2.5 : 1.2;
        if(A) mult = unaware ? (A>=2 ? 3.4 : 3.0) : 1.4;
        if(B) mult = unaware ? 2.2 : 1.2;
        if(run.ch && run.ch.c_shadow) mult *= 1.25;
        playerAttack(m, mult);
        if(B && !m.dead){ m.bleed = (B>=2?14:10); m.bleedT = 4; addLog('伤口开了口子。','y'); }
      }
      break;
    }
    case 'hide':
      run.hidden = true;
      run.res = clamp(run.res+5,0,run.resMax);
      if(B) run.shadowDodge = (B>=2?2:1);
      addLog('你隐入暗处。','g'); break;
    case 'smoke':
      G.smoke = {x:G.px, y:G.py, t:3, r: A ? (A>=2?3:2) : 1};
      if(B) run.smokeBlind = 2;
      addLog('烟气腾起，视线断了。','g'); break;
    case 'artery': {
      const m = mobAt(tx,ty);
      if(m){
        m.bleed = A ? (A>=2?16:12) : 8; m.bleedT = 4;
        if(B){ m.def = Math.max(0, m.def-3); addLog('他的甲松了。','y'); }
        playerAttack(m, 1.4);
        if(run.ch && run.ch.c_bloodfire && m.bleed) m.hp -= 6;
        addLog('血在往外涌。','y');
      }
      break;
    }
    case 'ignite': {
      const p = propAt(tx,ty);
      p.burning = 1;
      const rad = A ? (A>=2?2:1) : 0;
      for(let yy=ty-rad; yy<=ty+rad; yy++) for(let xx=tx-rad; xx<=tx+rad; xx++){
        const q = propAt(xx,yy);
        if(q && q.kind==='grain' && q.burning<=0) q.burning = 1;
      }
      if(B){
        let extra = 2;
        G.props.forEach(q=>{
          if(extra>0 && q.kind==='grain' && q.burning<=0 && dist(q.x,q.y,tx,ty)<=6){ q.burning=1; extra--; }
        });
      }
      addLog('粮堆着了。','y'); G.alarm=clamp(G.alarm+1,0,4);
      break;
    }
    case 'vanish':
      run.hidden = true;
      G.mobs.forEach(m=>{
        m.alert=false;
        if(m.rel==='hostile') m.whistle={x:G.px, y:G.py, t: A ? (A>=2?14:12) : 8};
      });
      if(B) run.shadowCrit = 1;
      addLog('你从所有视线里消失了。','g'); break;

    case 'lunge': {
      const m = mobAt(tx,ty);
      if(m){
        if(A) run._pierce = 0.5;
        playerAttack(m, 1.25);
        if(B && !m.dead) run.res = clamp(run.res+10,0,run.resMax);
      }
      break;
    }
    case 'brace':
      run.res = clamp(run.res+ (A?25:15),0,run.resMax);
      run.brace = 1;
      if(B) run.braceCrit = 1;
      addLog('你定了定势，下一击更沉。','y'); break;
    case 'setSpear':
      run.spearGuard = 1; addLog('枪立住了，等这一波冲上来。','y'); break;
    case 'pierceLine': {
      const ddx = Math.sign(tx-G.px), ddy = Math.sign(ty-G.py);
      const len = A ? 4 : 3;
      for(let i=1;i<=len;i++){
        const m = mobAt(G.px+ddx*i, G.py+ddy*i);
        if(m){
          playerAttack(m, 0.7);
          if(B) run.res = clamp(run.res+5,0,run.resMax);
        }
      }
      break;
    }
    case 'holdGate':
      run.gateGuard = 3; run.gateBonus = A ? 10 : 6;
      if(B){
        G.mobs.forEach(m=>{ if(!m.dead && dist(m.x,m.y,G.px,G.py)===1) stepToward(m, G.px - Math.sign(m.x-G.px), G.py - Math.sign(m.y-G.py)); });
      }
      addLog('脚底生根。','y'); break;
    case 'onestrike': {
      const m = mobAt(tx,ty);
      if(m){
        let cap = A ? 6 : 4.5;
        let mult = clamp(1 + run.res/20, 1, cap);
        if(run.ch && run.ch.c_surge && run.res>=run.resMax) mult *= 1.25;
        const resUsed = run.res;
        playerAttack(m, mult);
        addLog('一枪，倾尽所有。','y');
        run.res = (B && m.dead) ? Math.round(resUsed*0.5) : 0;
      }
      break;
    }

    case 'draw':
      run.res = clamp(run.res+ (A?25:15),0,run.resMax);
      if(B) run.aimCrit = 1;
      addLog('引弓，屏息。','y'); break;
    case 'stepShot': {
      const dist2 = A ? 2 : 1;
      const sx = Math.sign(tx-G.px || 0), sy = Math.sign(ty-G.py || 0);
      for(let k=1;k<=dist2;k++){
        const bx = G.px - sx, by = G.py - sy;
        if(walkable(bx,by) && !mobAt(bx,by)){ G.px=bx; G.py=by; }
      }
      run.movedThisTurn = true;
      if(B) run._comboShot = 0.3;
      const m = mobAt(tx,ty);
      if(m) playerAttack(m, 1.0);
      addLog('退一步，放一箭。','y');
      break;
    }
    case 'fireArrow': {
      const rad = A ? 2 : 1;
      for(let yy=ty-rad; yy<=ty+rad; yy++) for(let xx=tx-rad; xx<=tx+rad; xx++){
        const q = propAt(xx,yy);
        if(q && q.kind==='grain' && q.burning<=0){ q.burning=1; addLog('火箭落处，火起来了。','y'); G.alarm=clamp(G.alarm+1,0,4); }
      }
      if(B){
        G.mobs.forEach(m=>{
          if(!m.dead && dist(m.x,m.y,tx,ty)<=rad){
            m.bleed = Math.max(m.bleed||0, 6); m.bleedT = Math.max(m.bleedT||0, 2);
            addLog(m.name+' 身上着了。','y');
          }
        });
      }
      break;
    }
    case 'rapid': {
      const m = mobAt(tx,ty);
      if(m){
        const shots = A ? 3 : 2;
        for(let i=0;i<shots;i++){
          if(m.dead) break;
          const base = (i===1 && B) ? 0.9 : 0.6;
          const bonus = (run.ch && run.ch.c_firenet && m.bleedT>0) ? 1.25 : 1;
          playerAttack(m, base*bonus);
        }
      }
      run.res = clamp(run.res-20, 0, run.resMax);
      break;
    }
    case 'oneArrow': {
      const m = mobAt(tx,ty);
      if(m){
        let cap = A ? 6 : 5;
        let mult = clamp(1 + run.res/18, 1, cap);
        if(run.ch && run.ch.c_aim) mult *= 1.3;
        playerAttack(m, mult);
        addLog('一矢，尽了准头。','y');
        run.res = (B && m.dead) ? 20 : 0;
      }
      break;
    }
    case 'whistle':
      G.alarm = clamp(G.alarm+ (A?4:3),0,4);
      G.mobs.forEach(m=>{
        m.alert=true;
        m.whistle={x:tx,y:ty,t: (B?8:4)};
        if(B) m.stun = 2;
      });
      addLog('鸣镝破空，全营都听见了。','r'); break;
  }
  if(['backstab','artery','lunge','pierceLine','onestrike','stepShot','rapid','oneArrow','whistle'].includes(id)){
    run.hidden = false;
  }
  endTurn();
  return true;
}

/* ===== 回合推进 ===== */
function endTurn(){
  if(run){ run._shot = 0; run._pierce = 0; }
  if(!G || G.over) return;
  G.turn++;
  G.mobs.forEach(m=>{ if(m.cd>0) m.cd--; });

  // 弓手：站定才有准头，这一回合动过就不回
  if(run.cls==='bow' && !run.movedThisTurn){
    run.res = clamp(run.res+10,0,run.resMax);
  }
  Object.keys(run.cd).forEach(k=>{ if(run.cd[k]>0) run.cd[k]--; });

  // 燃烧
  G.props.forEach(p=>{
    if(p.burning>0){
      p.hp -= 18; G.alarm = clamp(G.alarm+1,0,4);
      if(p.hp<=0 && p.burning>0){ p.burning=2; addLog('粮堆烧塌了。','y'); }
    }
  });
  // 火盆周围的木桶会被引燃，粮堆烧到木桶会炸
  for(let y=0;y<GH;y++) for(let x=0;x<GW;x++){
    const t=G.tiles[y][x];
    if(t===6||t===T_BRAZI){
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{
        const nx2=x+dx, ny2=y+dy;
        if(nx2<0||ny2<0||nx2>=GW||ny2>=GH) return;
        if(G.tiles[ny2][nx2]===T_BARREL && Math.random()<0.35) explodeBarrel(nx2,ny2);
      });
    }
  }
  // 尸体被发现会拉高警觉
  if(G.turn%2===0){
    G.mobs.forEach(m=>{
      if(m.dead||m.rel!=='hostile'||m.alert) return;
      const c = G.mobs.find(o=>o.dead && dist(o.x,o.y,m.x,m.y)<=2);
      if(c){ m.alert=true; G.alarm=clamp(G.alarm+1,0,4); addLog(m.name+' 发现了尸体。','r'); }
    });
  }
  // 火光会一路引来援兵
  if(G.props.some(p=>p.burning>0) && G.turn%4===0) G.alarm = clamp(G.alarm+1,0,4);

  // 护着的人跟上来
  moveEscort();

  // 敌动
  G.mobs.forEach(m=>{
    if(m.dead) return;
    mobTurn(m);
    if(m.boss==='lvbu' && !m.dead && m.hp < m.max*0.5) mobTurn(m);   // 半血后二动
  });

  // 烟：敌人已经在这一片里摸过一遍，才算一个回合
  if(G.smoke){ G.smoke.t--; if(G.smoke.t<=0){ G.smoke=null; addLog('烟散了。',''); } }

  // 走完一个敌方阶段，防御姿态才开始计时
  if(run.spearGuard > 0) run.spearGuard--;
  if(run.gateGuard > 0){
    run.gateGuard--;
    if(run.gateGuard === 0){ run.gateBonus = 0; addLog('门守不住了。',''); }
  }

  // 警觉：没人盯着你，慢慢松下来
  const watched = G.mobs.some(m=>!m.dead && m.rel==='hostile' && m.alert && dist(m.x,m.y,G.px,G.py)<=10);
  if(!watched && G.turn%3===0) G.alarm = clamp(G.alarm-1,0,4);

  // 增援
  if(G.alarm>=2 && G.turn%6===0){
    const n = G.alarm>=4?2:1;
    for(let i=0;i<n;i++){
      let x=G.entry.x, y=G.entry.y;
      for(let t=0;t<20;t++){
        const nx=G.entry.x+rand(7)-3, ny=G.entry.y+rand(7)-3;
        if(walkable(nx,ny) && !mobAt(nx,ny)){ x=nx; y=ny; break; }
      }
      G.mobs.push(mkMob(pick(['levy','levy2','veteran']), x, y));
    }
    addLog('又有脚步声从背后压上来。','r');
  }

  // 状态
  if(run.hp<=0){ die(); return; }
  run.movedThisTurn = false;      // 回合清账，下一回合重新记录
  computeFOV();
  checkObjective();
  renderAll();
  saveGame();
}

/* 被护送的人跟着玩家走，一步一格 */
function moveEscort(){
  if(!G) return;
  G.items.forEach(it=>{
    if(!it.isEscort || !it.taken || it.dead) return;
    if(dist(it.x,it.y,G.px,G.py) <= 1) return;
    const path = bfsPath(it.x, it.y, G.px, G.py);
    if(path && path.length){
      const [nx,ny]=path[0];
      if(!mobAt(nx,ny) && walkable(nx,ny)){ it.x=nx; it.y=ny; }
    }
  });
}

/* ===== 敌人 AI ===== */
const MOBROLE = {levy:'inf', levy2:'scout', brute:'elite', soldier:'inf', archer:'archer',
                 veteran:'spear', guard:'shield', elite:'cav', sapper:'fire', boss:'gen'};
function mobRole(m){ return MOBROLE[m.type] || 'inf'; }

const BOSSSKILL = {
  huaxiong:{k:'cleave', t:'抡刀蓄力，要一刀把人劈成两半。'},
  lvbu:    {k:'sweep',  t:'画戟横扫，三步之内都是刃。'},
  dongzhuo:{k:'smash',  t:'举刀过顶，要砸碎这一片地。'}
};

function bossTurn(m){
  const d = dist(m.x,m.y,G.px,G.py);
  if(m.boss==='lvbu' && !m.p2 && m.hp < m.max*0.5){
    m.p2 = true; m.atk += 6;
    addLog('吕布的眼睛红了。他不再留手。','r');
  }
  const sk = BOSSSKILL[m.boss] || BOSSSKILL.huaxiong;
  if(!m.tele && d<=4 && G.turn - (m.lastTele||-9) >= 2){
    m.lastTele = G.turn;
    startTele(m, sk.k, sk.t);
    return;
  }
  if(d<=1) mobAttackPlayer(m);
  else stepToward(m,G.px,G.py);
}

function alarmUp(n){
  const old = G.alarm;
  G.alarm = clamp(G.alarm+n,0,4);
  if(G.alarm===old) return;
  const nm = ['未察觉','起疑','搜寻','警戒','追杀'][G.alarm];
  addLog('警觉升到 '+G.alarm+' 级：'+nm+'。','r');
  toast('警觉 '+G.alarm+' 级 · '+nm, G.alarm>=3);
  const el=document.getElementById('tb-alarm');
  if(el){ el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse'); }
}
function reinforce(src){
  let n=0;
  for(let k=0;k<60 && n<2;k++){
    const x=src.x+rand(11)-5, y=src.y+rand(11)-5;
    if(x>1&&y>1&&x<GW-1&&y<GH-1 && walkable(x,y) && !mobAt(x,y)){
      const mob=mkMob(Math.random()<0.5?'levy':'soldier',x,y);
      mob.alert=true; G.mobs.push(mob); n++;
    }
  }
  if(n) addLog('援兵从暗处涌出来，围了上来。','r');
}

/* 木桶爆炸：范围 1 内全体受伤，并把周围粮草点着 */
function explodeBarrel(x,y){
  if(tileAt(x,y)!==T_BARREL) return false;
  G.tiles[y][x] = 0;
  addLog('木桶炸开了！','y');
  G.mobs.forEach(m=>{
    if(!m.dead && dist(m.x,m.y,x,y)<=1) m.hp -= 20 + rand(8);
  });
  if(dist(G.px,G.py,x,y)<=1) run.hp -= Math.max(1, 14 + rand(6) - Math.round(pDef()*0.5));
  G.props.forEach(p2=>{ if(dist(p2.x,p2.y,x,y)<=2 && p2.burning<=0) p2.burning=1; });
  for(let yy=y-1;yy<=y+1;yy++) for(let xx=x-1;xx<=x+1;xx++){
    if(xx<0||yy<0||xx>=GW||yy>=GH) continue;
    if(tileAt(xx,yy)===T_BRAZI) G.tiles[yy][xx]=6;
  }
  G.alarm = clamp(G.alarm+1,0,4);
  return true;
}

function startTele(m, kind, txt){
  m.tele = {kind, t:1};
  addLog(m.name + txt, 'r');
  G.hasTele = true;
}
function applyTele(m){
  const k = m.tele.kind; m.tele = null;
  if(k==='thrust'){
    if(dist(m.x,m.y,G.px,G.py)<=2 && inLine(m,G.px,G.py)){ mobAttackPlayer(m, 1.55); }
    else addLog(m.name+' 一枪刺空。','');
  } else if(k==='volley'){
    if(dist(m.x,m.y,G.px,G.py)<=m.range) mobAttackPlayer(m, 1.25);
    else addLog(m.name+' 的箭落了空。','');
  } else if(k==='charge'){
    let hits=0;
    for(let k2=0;k2<3;k2++){
      const nx=m.x+Math.sign(G.px-m.x), ny=m.y+Math.sign(G.py-m.y);
      if(!walkable(nx,ny)||mobAt(nx,ny)) break;
      m.x=nx; m.y=ny;
      if(dist(m.x,m.y,G.px,G.py)<=1) break;
    }
    if(dist(m.x,m.y,G.px,G.py)<=1) mobAttackPlayer(m, 1.7);
    else addLog(m.name+' 冲了个空。','');
  } else if(k==='smash'){
    if(dist(m.x,m.y,G.px,G.py)<=2) mobAttackPlayer(m, 1.5);
    else addLog(m.name+' 重击砸在地上，土石四溅。','');
  } else if(k==='sweep'){
    if(dist(m.x,m.y,G.px,G.py)<=3 && inLine(m,G.px,G.py)) mobAttackPlayer(m, 1.85);
    else addLog(m.name+' 横扫落了空，戟风刮过耳边。','');
  } else if(k==='cleave'){
    if(dist(m.x,m.y,G.px,G.py)<=1) mobAttackPlayer(m, 1.7);
    else addLog(m.name+' 一刀劈空。','');
  } else if(k==='ignite'){
    let done=false;
    G.props.forEach(p2=>{ if(!done && p2.burning<=0 && dist(p2.x,p2.y,m.x,m.y)<=1){ p2.burning=1; done=true; } });
    addLog(done? m.name+' 把粮堆点着了。' : m.name+' 的火把凑了个空。', done?'r':'');
    if(done) G.alarm = clamp(G.alarm+1,0,4);
  }
}
function inLine(m,tx,ty){
  const dx=Math.sign(tx-m.x), dy=Math.sign(ty-m.y);
  if(dx!==0 && dy!==0) return false;
  let x=m.x+dx, y=m.y+dy;
  while(x!==tx||y!==ty){
    if(!walkable(x,y)) return false;
    x+=dx; y+=dy;
  }
  return true;
}
function retreatStep(m){
  const dx=Math.sign(m.x-G.px), dy=Math.sign(m.y-G.py);
  if(step(m,dx,dy)) return true;
  if(step(m,dx,0)) return true;
  if(step(m,0,dy)) return true;
  return false;
}

function mobTurn(m){
  if(m.rel!=='hostile'){
    if(m.rel==='ally') allyTurn(m);
    return;
  }
  if(m.stun>0){ m.stun--; addLog(m.name+' 还在乱转。',''); return; }
  if(m.waver>0){ m.waver--; return; }   // 军心散，站着不动
  if(m.bleedT>0){
    m.hp -= m.bleed; m.bleedT--;
    if(m.hp<=0){ m.dead=true; noteBossKill(m); addLog(m.name+' 血尽而倒。','g'); return; }
  }
  if(m.tele){ applyTele(m); return; }   // 蓄力先结算，Boss 与杂兵同规
  if(m.boss){ m.alert = true; bossTurn(m); return; }
  const d = dist(m.x,m.y,G.px,G.py);
  const canSee = (!run.hidden || d<=2) && canEnemySee(m);
  if(canSee && !m.alert){
    m.alert = true;
    if(!G.alarmTurn || G.turn - G.alarmTurn >= 3){   // 三次呼吸才升一级
      G.alarm = clamp(G.alarm+1,0,4);
      G.alarmTurn = G.turn;
    }
    addLog(m.name+' 发现了你。','r');
  }
  // 诱饵：鸣镝落点、绝影留下的旧影
  if(m.whistle){
    if(m.whistle.t>0){
      m.whistle.t--;
      if(!canSee && dist(m.x,m.y,m.whistle.x,m.whistle.y)>0){
        stepToward(m, m.whistle.x, m.whistle.y);
        return;
      }
    } else m.whistle = null;
  }
  if(!m.alert){
    // 警觉 2 级以上：没看见也要往你最后露面的地方搜
    if(G.alarm>=2 && G.lastSeen && dist(m.x,m.y,G.lastSeen.x,G.lastSeen.y)<=12){
      stepToward(m, G.lastSeen.x, G.lastSeen.y);
      return;
    }
    patrol(m);
    return;
  }
  const role = mobRole(m);
  // 预警起手
  if(role==='spear' && d===2 && inLine(m,G.px,G.py) && Math.random()<0.7){
    startTele(m,'thrust','压低枪尖，准备突刺。');
    return;
  }
  if(role==='archer' && d>=2 && d<=m.range && Math.random()<0.55){
    startTele(m,'volley','张弓搭箭，准备齐射。');
    return;
  }
  if(role==='cav' && d>=3 && d<=7 && inLine(m,G.px,G.py)){
    startTele(m,'charge','勒马蓄势，准备冲锋。');
    return;
  }
  if(role==='gen' && m.hp < m.max*0.5 && d<=3 && Math.random()<0.5){
    startTele(m,'smash','举刃过顶，准备重击。');
    return;
  }

  if(role==='inf' || role==='elite'){
    if(d<=1) mobAttackPlayer(m);
    else if(role==='elite' && d>=3 && Math.random()<0.5){
      // 精锐包夹：从玩家另一侧的空位贴上去
      const cands = DIRS.map(([dx,dy])=>({x:G.px+dx,y:G.py+dy}))
        .filter(c=>walkable(c.x,c.y) && !mobAt(c.x,c.y) && dist(c.x,c.y,m.x,m.y)>d);
      if(cands.length && stepToward(m,cands[0].x,cands[0].y)) return;
      stepToward(m,G.px,G.py);
    } else stepToward(m,G.px,G.py);
    return;
  }
  if(role==='spear'){
    if(d<=1){ if(!retreatStep(m)) mobAttackPlayer(m); return; }
    if(d===2) mobAttackPlayer(m);
    else stepToward(m,G.px,G.py);
    return;
  }
  if(role==='archer'){
    if(d>m.range) stepToward(m,G.px,G.py);
    else if(d<=1) retreatStep(m);
    else mobAttackPlayer(m);
    return;
  }
  if(role==='shield'){
    const ward = G.mobs.find(o=>!o.dead && o.rel==='hostile' && o!==m && (mobRole(o)==='archer'||mobRole(o)==='gen') && dist(o.x,o.y,m.x,m.y)<=4);
    if(ward && d>1){
      const gx=(ward.x+G.px)/2, gy=(ward.y+G.py)/2;
      stepToward(m, Math.round(gx), Math.round(gy));
      return;
    }
    if(d<=1){ m.guardT=1; mobAttackPlayer(m); }
    else stepToward(m,G.px,G.py);
    return;
  }
  if(role==='cav'){
    if(d<=1){ mobAttackPlayer(m); if(Math.random()<0.6) retreatStep(m); }
    else stepToward(m,G.px,G.py);
    return;
  }
  if(role==='scout'){
    if(!m.called && d<=6){
      m.called = true;
      G.alarm = clamp(G.alarm+1,0,4);
      addLog(m.name+' 吹响号角，援兵将至。','r');
      reinforce(m);
      return;
    }
    if(d<=1) mobAttackPlayer(m);
    else if(d<=3) retreatStep(m);
    else stepToward(m,G.px,G.py);
    return;
  }
  if(role==='fire'){
    let best=null, bd=999;
    G.props.forEach(p2=>{ const pd=dist(m.x,m.y,p2.x,p2.y); if(p2.hp>0 && p2.burning<=0 && pd<bd){bd=pd;best=p2;} });
    if(best && bd<d){
      if(bd<=1 && !m.teleDone){
        m.teleDone = true;
        startTele(m,'ignite','举着火把凑近粮堆。');
        return;
      }
      if(bd<=1){ best.burning=1; addLog(m.name+' 点着了粮草。','r'); G.alarm=clamp(G.alarm+1,0,4); }
      else stepToward(m,best.x,best.y);
      return;
    }
  }
  if(d<=1){ mobAttackPlayer(m); }
  else stepToward(m,G.px,G.py);
}

function patrol(m){
  if(m.patrol && m.patrol.length){
    const p2 = m.patrol[m.pi||0];
    if(p2){
      if(dist(m.x,m.y,p2.x,p2.y)<=1){ m.pi=((m.pi||0)+1)%m.patrol.length; }
      else stepToward(m,p2.x,p2.y);
      return;
    }
  }
  if(Math.random()<0.4){
    const dx=[-1,0,1][rand(3)], dy=[-1,0,1][rand(3)];
    step(m,dx,dy);
  }
}

function allyTurn(m){
  if(m.bleedT>0){
    m.hp -= m.bleed; m.bleedT--;
    if(m.hp<=0){ m.dead=true; noteBossKill(m); addLog(m.name+' 血尽而倒。',''); return; }
  }
  for(const [dx,dy] of DIRS){
    const o = mobAt(m.x+dx, m.y+dy);
    if(o && o.rel==='hostile'){ mobAttackMob(m,o); return; }
  }
  if(dist(m.x,m.y,G.px,G.py) > 2) stepToward(m, G.px, G.py);
}

function mobAttackMob(a,b){
  if(a.cd>0) return;
  const chance = clamp(0.40 + (a.atk-b.def)/45, 0.15, 0.90);
  if(Math.random()<chance){
    const dmg = Math.max(1, a.atk-b.def+rand(3));
    b.hp -= dmg;
    addLog(a.name+' 伤了 '+b.name+'  -'+dmg,'');
    if(b.hp<=0){ b.dead=true; addLog(b.name+' 倒下。',''); }
  } else addLog(a.name+' 失手。','');
  a.cd = 1;
}

/* 四邻 BFS：一次算清最短路，绝不往墙里钻 */
function bfsPath(sx, sy, tx, ty, ignoreMobs){
  ignoreMobs = (ignoreMobs !== false);
  if(sx===tx && sy===ty) return [];
  const goals = new Set();
  if(tx===G.px && ty===G.py){
    // 目标是玩家本人：走到任意一格相邻位即可
    for(const [dx,dy] of DIRS){
      const gx=G.px+dx, gy=G.py+dy;
      if(walkable(gx,gy) && !mobAt(gx,gy)) goals.add(gy*GW+gx);
    }
    if(!goals.size) return null;
  } else {
    goals.add(ty*GW+tx);
  }
  const q=[[sx,sy]], seen=new Set(), prev=new Map();
  seen.add(sy*GW+sx);
  while(q.length){
    const [x,y]=q.shift();
    for(const [dx,dy] of R4){
      const nx=x+dx, ny=y+dy;
      if(!walkable(nx,ny)) continue;
      const k=ny*GW+nx;
      if(seen.has(k)) continue;
      if(nx===G.px && ny===G.py) continue;   // 人挡人，绕开
      if(!ignoreMobs && (nx!==tx || ny!==ty)){
        if(mobAt(nx,ny)) continue;      // 路径规划时忽略会动的人，真走再避让
      }
      seen.add(k); prev.set(k,[x,y]);
      if(goals.has(k)){
        const path=[]; let cx=nx, cy=ny;
        while(!(cx===sx && cy===sy)){
          path.push([cx,cy]);
          const pv=prev.get(cy*GW+cx);
          if(!pv) break;
          cx=pv[0]; cy=pv[1];
        }
        return path.reverse();
      }
      q.push([nx,ny]);
    }
  }
  return null;
}

function stepToward(m,tx,ty){
  const path = bfsPath(m.x,m.y,tx,ty,true);
  if(path && path.length){
    const [nx,ny] = path[0];
    if(!mobAt(nx,ny) && !(nx===G.px&&ny===G.py)){ m.x = nx; m.y = ny; return true; }
  }
  return false;
}

function step(m,dx,dy){
  const nx=m.x+dx, ny=m.y+dy;
  if(!walkable(nx,ny)) return false;
  if(nx===G.px && ny===G.py) return false;
  if(mobAt(nx,ny)) return false;
  m.x=nx; m.y=ny;
  if(G.tiles[ny][nx]===T_TRAP){
    m.hp -= 8 + rand(6);
    G.tiles[ny][nx] = 0;
    addLog(m.name+' 踩进坑里。','y');
    if(m.hp<=0){ m.dead=true; noteBossKill(m); addLog(m.name+' 没爬起来。','g'); }
  }
  return true;
}

function mobAttackPlayer(m, mult){
  if(m.cd>0) return;
  mult = mult||1;

  // 身边的人更好杀，就先砍他
  const es = G.items.find(i=>i.isEscort && i.taken && !i.dead && dist(i.x,i.y,m.x,m.y)===1);
  if(es && Math.random()<0.55){
    const chance = clamp(0.55 + (m.atk - 4)/45, 0.20, 0.92);
    if(Math.random()<chance){
      const dmg = Math.max(1, m.atk - 4 + rand(3));
      es.hp -= dmg;
      addLog(m.name+' 砍向随行的人  -'+dmg,'r');
      if(es.hp<=0){
        es.dead = true;
        G.objFailed = true;
        addLog('随行的人倒下了。这一趟白走了。','r');
      }
    } else addLog(m.name+' 追着随行的人挥空。','');
    m.cd = 1;
    return;
  }

  const pm = tileMods(G.px,G.py);
  const em = tileMods(m.x,m.y);
  let chance = clamp(0.40 + (m.atk-pDef())/45 - pEva()/100 - pm.cover + em.hit, 0.10, 0.92);
  if(run.cls==='spear' && run.spearGuard>0){
    chance *= (run.ch && run.ch.c_wall) ? 0.15 : (mch('setSpear','a') ? 0.30 : 0.50);
  }
  if(run.smokeBlind>0){ chance -= 0.20; run.smokeBlind--; }
  chance = clamp(chance, 0.05, 0.95);
  if(Math.random()<chance){
    if(run.shadowDodge>0){
      run.shadowDodge--;
      addLog('影替——这一下落在空处。','g');
      m.cd = 1;
      return;
    }
    let dmg = Math.max(1, Math.round((m.atk - pDef() + rand(4)) * mult));
    run.hp -= dmg;
    G.hitT = nowT(); G.shake = nowT();
    pushFx(G.px, G.py, '-'+dmg, 'hurt');
    sfx('hurt');
    addLog(m.name+' 击中你  -'+dmg,'r');
    if(run.cls==='spear') run.res = clamp(run.res-15,0,run.resMax);
    if(run.cls==='bow') run.res = clamp(run.res-10,0,run.resMax);
    if(run.cls==='spear' && run.spearGuard>0){
      addLog('你反手一枪。','y');
      const wsG = gearStats('weapon');
      playerAttack(m, 0.8 + (wsG?wsG.guardBoost:0) + (mch('setSpear','b')?0.5:0), true);
    }
  } else {
    pushFx(G.px, G.py, '闪开', 'miss');
    addLog(m.name+' 扑空。','');
    if(run.cls==='spear') run.res = clamp(run.res-6,0,run.resMax);
  }
  m.cd = 1;
}

/* ===== 目标判定 ===== */
function checkObjective(){
  if(!G || !G.obj) return;
  const o = G.obj;
  let done=false;
  if(o.type==='burn'){
    G.objDone = G.props.filter(p=>p.burning>=2 || p.hp<=0).length;
    done = G.objDone >= o.need;
  } else if(o.type==='protect'){
    const alive = G.props.filter(p=>p.hp>0).length;
    G.objDone = alive;
    const enemies = G.mobs.filter(m=>!m.dead && m.rel==='hostile').length;
    done = alive >= o.need && enemies===0;
  } else if(o.type==='kill'){
    const t = G.mobs.find(m=>m.isTarget);
    done = !t || t.dead;
    G.objDone = done?1:0;
  } else if(o.type==='clear'){
    done = G.mobs.filter(m=>!m.dead && m.rel==='hostile').length===0;
    G.objDone = G.mobs.filter(m=>m.dead).length;
  } else if(o.type==='steal'){
    // 东西捡到手，再走到出口才算带出去
    const it = G.items[0];
    done = !!(it && it.taken);
    G.objDone = done?1:0;
  } else if(o.type==='escort'){
    const it = G.items.find(i=>i.isEscort);
    const alive = !!(it && it.taken && !it.dead);
    if(it && it.dead) G.objFailed = true;
    done = alive && dist(it.x,it.y,G.px,G.py)<=1 && !!G.atExit;
    G.objDone = done?1:0;
  }
  if(done && !G.objComplete){
    G.objComplete = true;
    addLog('事已办了。找出口。','g');
    toast('事已办了 · 找出口', true);
    sfx('win');
  }
  return done;
}

/* ===== 结束 ===== */
function tryEscape(){
  if(!G || G.over) return;
  if(!G.atExit){ addLog('还没到出口。','r'); return; }
  finishTask(true);
}

function finishTask(escaped){
  if(G.over) return;
  G.over = true;
  const done = checkObjective();
  const alarm = G.alarm;
  let grade, text;
  if(run.hp<=0){
    grade='dead'; text='你没能走出这一夜。';
  } else if(done && escaped){
    if(alarm<=2){ grade='success'; text='干净利落。没人看见，也没人追。'; }
    else { grade='partial'; text='事办成了，但留下了痕迹。'; }
  } else if(done && !escaped){
    grade='success'; text='事办成了。';
  } else if(escaped){
    grade='failure'; text='你跑了出来，事没办成。';
  } else {
    grade='aborted'; text='撑不住了，只能走。';
  }
  const expGain = grade==='success' ? (escaped?70:95)
                : grade==='partial' ? 55
                : grade==='failure' ? 25
                : 12;
  addExp(expGain);
  G.result = {grade, text, done, escaped, alarm, kills:run.kills, turn:G.turn, objDone:G.objDone, exp:expGain};
  applyOutcome();
  renderAll();
  showResult();
}

function noteBossKill(m){
  if(m && m.boss) metaAdd('codex', 'kill_'+m.boss);
}
function die(){
  sfx('dead');
  if(G.over) return;
  G.over=true;
  G.result = {grade:'dead', text:'血尽于此。', done:false, escaped:false, alarm:G.alarm, kills:run.kills, turn:G.turn, objDone:G.objDone};
  applyOutcome();
  showDeath();
}

/* ===== 结算写回世界 ===== */
function applyOutcome(){
  const c = G.cfg, r = G.result;
  if(!c) return;
  const fac = (c.reward && c.reward.fac) || {};
  const mult = r.grade==='success'?1 : r.grade==='partial'?0.6 : r.grade==='failure'?0.2 : 0;
  Object.keys(fac).forEach(k=>{
    if(W.factions[k]){
      const v = fac[k];
      const ff = W.factions[k];
      ff.mil = clamp(ff.mil + v*mult, 5, 100);
      ff.mor = clamp(ff.mor + v*mult*0.8, 5, 100);
      ff.trust = clamp(ff.trust + v*mult*1.2, 0, 100);
      ff.sup = clamp(ff.sup + v*mult*0.5, 0, 100);
    }
  });
  run.fame += Math.round(((c.reward && c.reward.fame)||0) * mult);
  if(r.grade==='success') W.flags['last_clean_'+W.evIdx]=true;
  if(G.alarm>=3) W.flags['noisy_'+W.evIdx]=true;
  facTick();
}

function updateTopbar(){
  if(!run) return;
  document.getElementById('tb-year').textContent = W.year;

  document.getElementById('tb-lv').textContent = 'Lv.'+run.lv;

  document.getElementById('tb-st').textContent = Math.floor(run.st);
  document.getElementById('tb-resname').textContent = run.resName;
  document.getElementById('tb-res').textContent = Math.floor(run.res);
  const thEl = document.getElementById('tb-theme');
  if(thEl) thEl.textContent = G && G.cfg ? (THEME_NAME[G.cfg.mood==='palace'?'palace':G.cfg.theme] || '野地') : '—';
  const al = G? G.alarm : 0;
  const alName = ['未察觉','起疑','搜寻','警戒','追杀'][al] || '';
  document.getElementById('tb-alarm').textContent = G? (al+' '+alName) : 0;
  document.getElementById('tb-fame').textContent = run.fame;
  document.getElementById('tb-sp').textContent = run.sp||0;
  const tk = document.getElementById('tb-task');
  if(G && G.obj){
    let s='';
    if(G.obj.type==='burn') s=`纵火 ${G.objDone||0}/${G.obj.need}`;
    else if(G.obj.type==='protect') s=`守粮 ${G.objDone||0}/${G.obj.need}`;
    else if(G.obj.type==='kill') s=G.objComplete?'已斩':'未斩';
    else if(G.obj.type==='steal') s=G.objComplete?'得手':'未得手';
    else if(G.obj.type==='escort') s=G.objComplete?'已接':'未接';
    else if(G.obj.type==='clear') s=`残余 ${G.mobs.filter(m=>!m.dead && m.rel==='hostile').length}`;
    tk.textContent = s;
  } else tk.textContent = '';
}

function updateSkills(){
  const box = document.getElementById('skills');
  if(!run){ box.innerHTML=''; return; }
  box.innerHTML = run.skills.map((id,i)=>{
    const s = SKILLS[id];
    const locked = run.lv < s.lv;
    const cdd = run.cd[id]||0;
    const cls = locked?'skill dead':(UI.pending===id?'skill on':'skill');
    return `<div class="${cls}" data-sk="${id}">
      <span class="nm">${i+1}. ${s.name}${locked?'（未成）':''}</span>
      <span class="cs">${locked? 'Lv'+s.lv : (cdd>0?cdd+'回合':((run.rank&&run.rank[id])?'阶'+run.rank[id]:'')) }</span>
    </div>`;
  }).join('');
  [...box.querySelectorAll('[data-sk]')].forEach(el=>{
    el.onclick = ()=>{
      const id = el.dataset.sk;
      if(run.lv < SKILLS[id].lv) return;
      if(UI.mode==='aim' && UI.pending===id){ clearAim(); return; }
      beginAim(id);
    };
  });
}

function X(x){ return (x-camX)*TS; }
function Y(y){ return (y-camY)*TS; }

/* ===== 第五批渲染：材质、建筑、火烟水、人形 ===== */
let ANIM_T=0;
function nowT(){
  if(typeof performance!=='undefined' && performance.now) return performance.now()/1000;
  return Date.now()/1000;
}
function hash2(x,y,k){
  let n = (x*374761393 + y*668265263 + (k||0)*1274126177);
  n = (n ^ (n>>>13)) * 1274126177;
  n = n ^ (n>>>16);
  return ((n>>>0) % 1000)/1000;
}
const TH_BASE = {
  camp:['#463d2a','#483f2c'], town:['#3d3931','#3f3b33'],
  palace:['#39322c','#3b342e'], mountain:['#3b372f','#3d3931'],
  ford:['#363f39','#38413b'], granary:['#453e2d','#47402f']
};
function themeOf(){ return (G.cfg && (G.cfg.mood==='palace'?'palace':G.cfg.theme)) || 'camp'; }

function drawGround(x,y,t,vis){
  const th=themeOf();
  const base=(TH_BASE[th]||TH_BASE.camp)[(x+y)%2];
  ctx.fillStyle=base; ctx.fillRect(X(x),Y(y),TS,TS);
  const h=hash2(x,y,1);
  // 砂砾质感
  for(let i=0;i<4;i++){
    const r=hash2(x,y,20+i), r2=hash2(x,y,40+i);
    ctx.fillStyle = r>0.55? 'rgba(240,224,186,.05)' : 'rgba(0,0,0,.11)';
    ctx.fillRect(X(x)+r*TS, Y(y)+r2*TS, 2+r*2.5, 2+r2*2);
  }
  if(th==='town'){
    ctx.strokeStyle='rgba(18,15,12,.55)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(X(x),Y(y)+TS*.5); ctx.lineTo(X(x)+TS,Y(y)+TS*.5); ctx.stroke();
  } else if(th==='palace'){
    ctx.strokeStyle='rgba(20,16,12,.5)'; ctx.lineWidth=1;
    ctx.strokeRect(X(x)+.5,Y(y)+.5,TS-1,TS-1);
    if(h>.8){ ctx.fillStyle='rgba(190,150,80,.07)'; ctx.fillRect(X(x)+4,Y(y)+4,TS-8,TS-8); }
  } else if(th==='camp'||th==='granary'){
    if(h>.5){ ctx.fillStyle='rgba(120,96,52,.15)'; ctx.fillRect(X(x)+h*TS*.7,Y(y)+h*TS*.45,2,2); }
    if(h>.86){ ctx.fillStyle='rgba(90,110,60,.13)'; ctx.fillRect(X(x)+5,Y(y)+TS-8,3,2); }
  } else if(th==='mountain'){
    if(h>.4){ ctx.fillStyle='rgba(150,140,120,.10)'; ctx.beginPath(); ctx.arc(X(x)+h*TS,Y(y)+h*TS*.8,1.7,0,7); ctx.fill(); }
  } else if(th==='ford'){
    ctx.strokeStyle='rgba(150,190,190,.09)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(X(x)+3,Y(y)+TS*.45); ctx.lineTo(X(x)+TS-3,Y(y)+TS*.55); ctx.stroke();
  }
  if(t===3 && vis){
    const g=hash2(x,y,3);
    ctx.strokeStyle='rgba(110,132,78,.55)'; ctx.lineWidth=1;
    for(let i=0;i<3;i++){
      const gx=X(x)+6+g*18+i*5, gy=Y(y)+TS-5;
      ctx.beginPath(); ctx.moveTo(gx,gy); ctx.lineTo(gx+1.4, gy-3-hash2(x,y,10+i)*4); ctx.stroke();
    }
  }
  if(!vis){ ctx.fillStyle='rgba(6,6,8,.62)'; ctx.fillRect(X(x),Y(y),TS,TS); }
}

function drawWall(x,y,vis){
  const px=X(x), py=Y(y), th=themeOf(), h=hash2(x,y,7);
  if(th==='camp'){
    ctx.fillStyle=vis?'#5c4a32':'#2b2318'; ctx.fillRect(px,py,TS,TS);
    ctx.strokeStyle='rgba(18,13,8,.5)'; ctx.lineWidth=1;
    for(let i=1;i<4;i++){ ctx.beginPath(); ctx.moveTo(px+i*TS/4,py+2); ctx.lineTo(px+i*TS/4,py+TS-2); ctx.stroke(); }
    ctx.fillStyle=vis?'rgba(222,180,112,.52)':'rgba(110,95,66,.34)';
    ctx.fillRect(px,py,TS,3);
    if(h>.72){
      ctx.fillStyle=vis?'#17110b':'#0d0a06';
      ctx.beginPath(); ctx.moveTo(px+TS*.34,py+TS); ctx.lineTo(px+TS*.5,py+TS*.42); ctx.lineTo(px+TS*.66,py+TS); ctx.fill();
    }
  } else if(th==='town'){
    const g=ctx.createLinearGradient(px,py,px,py+TS);
    g.addColorStop(0, vis?'#6a5a44':'#322a20'); g.addColorStop(1, vis?'#453a2c':'#221d14');
    ctx.fillStyle=g; ctx.fillRect(px,py,TS,TS);
    if(h>.52){
      ctx.fillStyle=vis?'rgba(28,23,18,.72)':'rgba(16,13,10,.7)';
      for(let i=0;i<4;i++) ctx.fillRect(px+3+i*9, py+2, 7, TS-4);
      ctx.fillStyle=vis?'rgba(198,158,96,.18)':'rgba(90,75,50,.16)';
      ctx.fillRect(px,py+TS-4,TS,3);
    }
    ctx.strokeStyle='rgba(14,11,8,.6)'; ctx.strokeRect(px+.5,py+.5,TS-1,TS-1);
  } else if(th==='palace'){
    const g=ctx.createLinearGradient(px,py,px,py+TS);
    g.addColorStop(0, vis?'#7a382c':'#36180f'); g.addColorStop(1, vis?'#4c241d':'#24110d');
    ctx.fillStyle=g; ctx.fillRect(px,py,TS,TS);
    ctx.fillStyle=vis?'rgba(202,152,62,.42)':'rgba(110,82,38,.24)';
    ctx.fillRect(px,py,TS,2); ctx.fillRect(px,py+TS-3,TS,2);
    ctx.strokeStyle=vis?'rgba(190,140,60,.22)':'rgba(110,82,38,.2)';
    ctx.strokeRect(px+5,py+6,TS-10,TS-12);
  } else if(th==='mountain'){
    ctx.fillStyle=vis?'#4c473b':'#242219'; ctx.fillRect(px,py,TS,TS);
    ctx.fillStyle=vis?'#635c4c':'#302d24';
    ctx.beginPath(); ctx.moveTo(px+2,py+TS-2); ctx.lineTo(px+TS*.42,py+2); ctx.lineTo(px+TS*.78,py+TS-2); ctx.fill();
    ctx.strokeStyle='rgba(18,16,12,.55)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(px+TS*.42,py+7); ctx.lineTo(px+TS*.54,py+TS-7); ctx.stroke();
  } else {
    ctx.fillStyle=vis?'#564430':'#281f14'; ctx.fillRect(px,py,TS,TS);
    ctx.strokeStyle='rgba(18,13,8,.55)'; ctx.lineWidth=1;
    for(let i=1;i<5;i++){ ctx.beginPath(); ctx.moveTo(px,py+i*TS/5); ctx.lineTo(px+TS,py+i*TS/5); ctx.stroke(); }
    ctx.fillStyle=vis?'rgba(198,162,98,.22)':'rgba(105,90,58,.18)';
    ctx.fillRect(px,py,TS,2);
  }
  ctx.fillStyle='rgba(0,0,0,.28)'; ctx.fillRect(px,py+TS-4,TS,4);
  ctx.fillStyle='rgba(0,0,0,.16)'; ctx.fillRect(px+TS-3,py,3,TS);
  if(!vis){ ctx.fillStyle='rgba(6,6,8,.34)'; ctx.fillRect(px,py,TS,TS); }
}

/* 水火：都在动 */
function drawFire(cx,cy,r,tms){
  const p=3;
  ctx.save();
  const grad=ctx.createRadialGradient(cx,cy,1,cx,cy,r*2.4);
  grad.addColorStop(0,'rgba(255,190,90,.55)');
  grad.addColorStop(.45,'rgba(232,132,44,.28)');
  grad.addColorStop(1,'rgba(232,132,44,0)');
  ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(cx,cy,r*2.4,0,7); ctx.fill();
  for(let i=0;i<3;i++){
    const ph=tms*3.2+i*2.1;
    const hgt=r*(1.5+Math.sin(ph)*0.5);
    const w=r*(0.75+Math.cos(ph*1.3)*0.2);
    const dx=Math.sin(ph*2.2)*r*0.35;
    ctx.fillStyle=i===0?'rgba(232,132,44,.85)':(i===1?'rgba(255,190,90,.75)':'rgba(255,238,190,.6)');
    ctx.beginPath();
    ctx.moveTo(cx-w+dx,cy+r*.5);
    ctx.quadraticCurveTo(cx-w*.5+dx, cy-hgt*.6, cx+dx, cy-hgt);
    ctx.quadraticCurveTo(cx+w*.5+dx, cy-hgt*.6, cx+w+dx, cy+r*.5);
    ctx.fill();
  }
  ctx.restore();
}
function drawWater(px,py,x,y,tms,shallow){
  ctx.fillStyle = shallow?'#2a4242':'#1b3038';
  ctx.fillRect(px,py,TS,TS);
  ctx.strokeStyle= shallow?'rgba(150,200,200,.22)':'rgba(120,180,200,.22)';
  ctx.lineWidth=1;
  for(let i=0;i<3;i++){
    const off=Math.sin(tms*1.1+x*0.7+y*0.4+i*1.7)*4;
    const yy=py+8+i*11;
    ctx.beginPath();
    ctx.moveTo(px+3+off, yy);
    ctx.quadraticCurveTo(px+TS*.45, yy-3, px+TS-3+off, yy+1);
    ctx.stroke();
  }
  if(!shallow){ ctx.fillStyle='rgba(180,230,240,.06)'; ctx.fillRect(px,py,TS,6); }
}

/* 人形：一眼分得清兵种 */
function drawFig(cx,cy,o){
  const s=o.s||1, bob=o.bob||0;
  ctx.save();
  ctx.translate(cx,cy+bob); ctx.scale(s,s);
  const skin=o.skin||'#c8a878';
  const cloth=o.cloth||'#5a4c34';
  const metal=o.metal||'#8a8880';
  ctx.fillStyle='rgba(0,0,0,.34)';
  ctx.beginPath(); ctx.ellipse(0,15,10.5,3.6,0,0,7); ctx.fill();
  if(o.cloak){
    ctx.fillStyle=o.cloak; ctx.globalAlpha=.85;
    ctx.beginPath(); ctx.moveTo(-7,-4); ctx.lineTo(7,-4); ctx.lineTo(10.5,13); ctx.lineTo(-10.5,13); ctx.fill();
    ctx.globalAlpha=1;
  }
  ctx.fillStyle=o.legs||'#2c2517';
  ctx.fillRect(-6,4,4.6,11); ctx.fillRect(1.4,4,4.6,11);
  ctx.fillStyle=cloth;
  ctx.beginPath(); ctx.moveTo(-7,-2); ctx.lineTo(7,-2); ctx.lineTo(5.5,6.5); ctx.lineTo(-5.5,6.5); ctx.fill();
  if(o.armor!==false){
    ctx.fillStyle=metal;
    ctx.fillRect(-6.4,-1.2,12.8,3.2);
    ctx.fillRect(-5.2,2.2,10.4,2.2);
  }
  ctx.fillStyle=o.skinSleeve||cloth;
  ctx.fillRect(-9.4,-1.4,3,8.4);
  ctx.fillRect(6.4,-1.4,3,8.4);
  ctx.fillStyle=skin; ctx.beginPath(); ctx.arc(0,-8,4.7,0,7); ctx.fill();
  if(o.helm){
    ctx.fillStyle=o.helmColor||'#6c6a62';
    ctx.beginPath(); ctx.arc(0,-9.2,5.4,Math.PI,0); ctx.fill();
    ctx.fillRect(-5.4,-9.2,10.8,2.2);
    if(o.plume){ ctx.fillStyle=o.plume; ctx.fillRect(-1.2,-15.5,2.6,6.4); }
  } else if(o.band){
    ctx.fillStyle=o.band; ctx.fillRect(-5.2,-11.6,10.4,2.8);
  }
  // 兵器
  if(o.wp==='blade'){
    ctx.strokeStyle='#c9c2ac'; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.moveTo(9,3); ctx.lineTo(17,-8); ctx.stroke();
    ctx.strokeStyle='#6a5330'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(7.6,5); ctx.lineTo(10,1.6); ctx.stroke();
  } else if(o.wp==='spear' || o.wp==='halberd'){
    ctx.strokeStyle='#8a7444'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(10,7); ctx.lineTo(12,-19); ctx.stroke();
    ctx.fillStyle='#cfc8b0';
    ctx.beginPath(); ctx.moveTo(12,-27); ctx.lineTo(14.4,-19); ctx.lineTo(9.6,-19); ctx.fill();
    if(o.wp==='halberd'){
      ctx.strokeStyle='#cfc8b0'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(12.4,-20); ctx.quadraticCurveTo(19,-22,19.4,-15); ctx.stroke();
    }
  } else if(o.wp==='bow'){
    ctx.strokeStyle='#b08a52'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(11,-2,9,-1.15,1.15); ctx.stroke();
    ctx.strokeStyle='rgba(230,220,190,.7)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(11+3.6,-10.4); ctx.lineTo(11+3.6,5.6); ctx.stroke();
  } else if(o.wp==='hammer'){
    ctx.strokeStyle='#6a5330'; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.moveTo(9,4); ctx.lineTo(14,-9); ctx.stroke();
    ctx.fillStyle='#8d887c'; ctx.fillRect(11.4,-15,7,6);
  } else if(o.wp==='stick'){
    ctx.strokeStyle='#7a6140'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(9,5); ctx.lineTo(14,-10); ctx.stroke();
  } else if(o.wp==='torch'){
    ctx.strokeStyle='#6a5330'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(9,5); ctx.lineTo(13,-8); ctx.stroke();
    drawFire(13+cx*0-0,-9,3.4,nowT());
  }
  if(o.shield){
    ctx.fillStyle=o.shieldColor||'#7a6a4a';
    ctx.strokeStyle='#3a3222'; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.roundRect? ctx.roundRect(-14,-4,7.5,16,2.5) : ctx.rect(-14,-4,7.5,16);
    ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

function mobLook(m){
  const rel=m.rel;
  const relTint = rel==='ally'? 'rgba(120,190,120,.35)' : (rel==='neutral'? 'rgba(210,170,70,.35)' : null);
  const base={ rel, s:1.05 };
  if(m.boss){
    return Object.assign(base,{ s:1.32, cloak:'#8a2a22', cloth:'#4a3826', metal:'#b9a06a',
      helmColor:'#c8a24a', plume:'#d84a2a', wp:(m.boss==='lvbu'?'halberd':'blade'), skin:'#d2b087' });
  }
  switch(m.type){
    case 'levy':   return Object.assign(base,{ cloth:'#5a4a30', band:'#c8a24a', metal:'#7d7364', wp:'stick', armor:false });
    case 'levy2':  return Object.assign(base,{ cloth:'#6a4a30', band:'#c8963e', metal:'#8a7a5a', wp:'blade' });
    case 'brute':  return Object.assign(base,{ s:1.16, cloth:'#5a3826', metal:'#9a8a6a', wp:'hammer', helm:true, helmColor:'#7a6a52' });
    case 'soldier':return Object.assign(base,{ cloth:'#4a5236', metal:'#9aa08a', wp:'spear', helm:true, helmColor:'#77806a' });
    case 'archer': return Object.assign(base,{ cloth:'#5a5334', metal:'#8a8464', wp:'bow', band:'#8a7a4a' });
    case 'veteran':return Object.assign(base,{ cloth:'#4a4c38', metal:'#a0a496', wp:'blade', helm:true, helmColor:'#8a8e80', shield:true, shieldColor:'#6a6a58' });
    case 'guard':  return Object.assign(base,{ cloth:'#39445a', metal:'#a8b0c0', wp:'spear', helm:true, helmColor:'#8a94a8', shield:true, shieldColor:'#586a86' });
    case 'elite':  return Object.assign(base,{ s:1.2, cloth:'#4a2a3a', metal:'#b0a8b8', wp:'halberd', helm:true, helmColor:'#a08aa8', plume:'#c85a8a', cloak:'#5a2a3a' });
    case 'sapper': return Object.assign(base,{ cloth:'#6a5230', metal:'#8a7a52', wp:'torch', band:'#c8963e' });
    default:       return Object.assign(base,{ cloth:'#5a4c34', metal:'#8a8880', wp:'blade' });
  }
}

function drawMobUnit(m){
  const vis = G.visible[m.y] && G.visible[m.y][m.x];
  const px=X(m.x), py=Y(m.y);
  const o = mobLook(m);
  const t=nowT();
  const flash = m.hitT && (t-m.hitT)<0.22;
  ctx.save();
  if(!vis) ctx.globalAlpha=.45;
  const bob = Math.sin(t*2 + m.x*1.3 + m.y)*0.9;
  drawFig(px+TS/2, py+TS/2, Object.assign({}, o, {bob:bob}));
  // 关系描边：绿/黄/红
  const rc = RELCOL[m.rel]||'#b8563a';
  ctx.strokeStyle = rc; ctx.lineWidth=1.4; ctx.globalAlpha = vis? .55 : .25;
  ctx.beginPath(); ctx.ellipse(px+TS/2, py+TS-1.5, TS*.36, 3.6, 0,0,7); ctx.stroke();
  ctx.globalAlpha=1;
  if(flash){
    ctx.fillStyle='rgba(255,240,220,.55)';
    ctx.fillRect(px+3,py+3,TS-6,TS-6);
  }
  // 血条
  if(vis && (m.hp<m.max || m.boss)){
    const w=TS*.8, h=3.2;
    if(m.hpAnim===undefined) m.hpAnim=m.hp;
    m.hpAnim += (m.hp-m.hpAnim)*0.18*(SET.speed||1);
    ctx.fillStyle='rgba(10,8,6,.75)'; ctx.fillRect(px+(TS-w)/2, py+TS-6.5, w, h);
    ctx.fillStyle= m.rel==='ally'? '#6fae5a' : '#b8563a';
    ctx.fillRect(px+(TS-w)/2, py+TS-6.5, w*clamp(m.hpAnim/m.max,0,1), h);
    if(m.hpAnim > m.hp+0.5){ // 掉血的余影
      ctx.fillStyle='rgba(240,200,120,.55)';
      ctx.fillRect(px+(TS-w)/2 + w*clamp(m.hp/m.max,0,1), py+TS-6.5, w*(clamp(m.hpAnim/m.max,0,1)-clamp(m.hp/m.max,0,1)), h);
    }
  }
  // Boss 标识
  if(m.boss && vis){
    ctx.fillStyle='#e8c86a'; ctx.font='bold 10px serif'; ctx.textAlign='center';
    ctx.fillText('◆', px+TS/2, py-2);
    ctx.fillStyle='rgba(232,200,106,.14)'; ctx.fillRect(px+1,py+1,TS-2,TS-2);
  }
  // 警觉
  if(vis && m.alert){
    ctx.fillStyle= m.tele? '#e8842c' : '#d05a3a';
    ctx.font='bold 11px serif'; ctx.textAlign='center';
    ctx.fillText(m.tele? '!' : '!', px+TS-3, py+10);
  }
  ctx.restore();
}

function drawPlayerUnit(){
  const px=X(G.px), py=Y(G.py), t=nowT();
  const cls=run.cls;
  const base={ s:1.1, skin:'#e2c9a0', cloth: cls==='dagger'?'#2e2a24':(cls==='bow'?'#3a3426':'#3a3026'),
    metal:'#9a9384', rel:'#e8d5a3' };
  if(cls==='dagger') Object.assign(base,{ wp:'blade', band:'#8a2f24', cloak:'#2a2320', cloakSlim:true });
  if(cls==='spear')  Object.assign(base,{ wp:'spear', helm:true, helmColor:'#8a8a7a', armor:true });
  if(cls==='bow')    Object.assign(base,{ wp:'bow', band:'#6f9e6a' });
  if(run.hidden) ctx.globalAlpha=.62;
  const bob=Math.sin(t*2.2)*0.8;
  drawFig(px+TS/2, py+TS/2, Object.assign({},base,{bob:bob}));
  ctx.globalAlpha=1;
  // 脚下光圈
  const pulse=.5+Math.sin(t*2.4)*.18;
  ctx.strokeStyle=`rgba(232,213,163,${0.28+pulse*0.16})`; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.ellipse(px+TS/2, py+TS-2, TS*.36, 4.2, 0,0,7); ctx.stroke();
  if(run.hidden){
    ctx.strokeStyle='rgba(140,200,160,.5)'; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.arc(px+TS/2, py+TS/2, TS*.46, 0,7); ctx.stroke(); ctx.setLineDash([]);
  }
  if(G.hitT && nowT()-G.hitT<0.25){
    ctx.fillStyle='rgba(220,60,50,.35)'; ctx.fillRect(px+2,py+2,TS-4,TS-4);
  }
  // 血条
  const w=TS*.82;
  ctx.fillStyle='rgba(10,8,6,.8)'; ctx.fillRect(px+(TS-w)/2, py+TS-6, w, 3.4);
  ctx.fillStyle='#c0503a'; ctx.fillRect(px+(TS-w)/2, py+TS-6, w*clamp(run.hp/run.maxhp,0,1), 3.4);
}

/* 飘字与演出 */
function pushFx(gx,gy,txt,kind){
  if(!G) return;
  if(!G.fx) G.fx=[];
  const k = kind||'dmg';
  const base = k==='crit'?1.15:0.9;
  G.fx.push({gx,gy,txt,kind:k,t0:nowT(),life:base/(SET.speed||1)});
}
function toast(txt,big){
  if(!G) return;
  G.toast={txt,t0:nowT(),big:!!big};
}
function drawFx(){
  if(!G) return;
  const t=nowT();
  if(!G.fx) G.fx=[];
  G.fx = G.fx.filter(f=>t-f.t0 < (f.life||0.9));
  G.fx.forEach(f=>{
    const age=t-f.t0;
    const p=clamp(age/(f.life||0.9),0,1);
    const px=X(f.gx)+TS/2, py=Y(f.gy)+TS/2 - age*34;
    ctx.save();
    ctx.globalAlpha=clamp(1-p*1.1,0,1);
    if(f.kind==='crit'){
      ctx.font='bold 22px "Songti SC",serif'; ctx.textAlign='center';
      ctx.fillStyle='#f0d16a'; ctx.strokeStyle='rgba(60,20,10,.9)'; ctx.lineWidth=3;
      ctx.strokeText(f.txt, px, py); ctx.fillText(f.txt, px, py);
      // 放射
      ctx.strokeStyle=`rgba(240,209,106,${(1-p)*.8})`; ctx.lineWidth=2;
      for(let i=0;i<8;i++){
        const a=i*Math.PI/4 + age*1.2;
        const r1=10+age*26, r2=r1+8;
        ctx.beginPath();
        ctx.moveTo(px+Math.cos(a)*r1, py+Math.sin(a)*r1);
        ctx.lineTo(px+Math.cos(a)*r2, py+Math.sin(a)*r2);
        ctx.stroke();
      }
    } else {
      ctx.font='bold 16px "Songti SC",serif'; ctx.textAlign='center';
      ctx.fillStyle= f.kind==='heal'? '#8fd07a' : (f.kind==='miss'? '#9aa0a8' : '#e8d5a3');
      ctx.strokeStyle='rgba(30,16,10,.85)'; ctx.lineWidth=2.6;
      ctx.strokeText(f.txt, px, py); ctx.fillText(f.txt, px, py);
    }
    ctx.restore();
  });
  if(G.toast){
    const age=t-G.toast.t0, dur=(G.toast.big?2.2:1.6)/(SET.speed||1);
    if(age>dur){ G.toast=null; }
    else {
      const a = age<0.25? age/0.25 : (age>dur-0.4? (dur-age)/0.4 : 1);
      ctx.save(); ctx.globalAlpha=clamp(a,0,1);
      const w=G.toast.big? 320:240, h=G.toast.big?44:30;
      const cx=cv.width/2, cy=G.toast.big? 74 : 58;
      ctx.fillStyle='rgba(18,14,10,.9)'; ctx.fillRect(cx-w/2, cy-h/2, w, h);
      ctx.strokeStyle='rgba(200,150,62,.7)'; ctx.lineWidth=1;
      ctx.strokeRect(cx-w/2+.5, cy-h/2+.5, w-1, h-1);
      ctx.fillStyle= G.toast.big? '#e8c86a':'#d9cdb0';
      ctx.font=(G.toast.big?'bold 18px':'14px')+' "Songti SC",serif'; ctx.textAlign='center';
      ctx.fillText(G.toast.txt, cx, cy+6);
      ctx.restore();
    }
  }
}

/* 小地图：未探索不显示敌人 */
function drawMini(){
  const mw=GW*3.0, mh=GH*3.0;
  const ox=cv.width-mw-12, oy=12;
  ctx.save();
  ctx.fillStyle='rgba(10,9,7,.94)'; ctx.fillRect(ox,oy,mw,mh);
  ctx.strokeStyle='rgba(200,150,62,.55)'; ctx.lineWidth=1; ctx.strokeRect(ox+.5,oy+.5,mw-1,mh-1);
  const cw=mw/GW, ch=mh/GH;
  for(let y=0;y<GH;y++) for(let x=0;x<GW;x++){
    if(!G.explored[y][x]) continue;
    const t=G.tiles[y][x];
    let col=null;
    if(t===1) col='#6a5f4a';
    else if(t===2) col='#1f4050';
    else if(t===3) col='#33401f';
    else if(t===5) col='#6f9e6a';
    else if(t===T_HIGH) col='#3f4030';
    else if(t===T_ROCK) col='#3a352c';
    else if(t===T_SHALLOW) col='#254450';
    else if(t===T_TRAP) col='#3a2418';
    else if(t===T_BOAT) col='#4a3a22';
    else if(t===T_DOOR) col='#5a4a32';
    else if(t===T_BARREL) col='#4a3a20';
    else col='#3a3324';
    ctx.fillStyle=col;
    ctx.fillRect(ox+x*cw, oy+y*ch, Math.ceil(cw), Math.ceil(ch));
  }
  // 目标
  if(G.obj){
    if(G.obj.type==='escort'){
      if(G.obj.x!==undefined && G.explored[G.obj.y] && G.explored[G.obj.y][G.obj.x]){
        ctx.fillStyle='#e8c86a'; ctx.fillRect(ox+G.obj.x*cw-1, oy+G.obj.y*ch-1, 4,4);
      }
    }
    G.props.forEach(p=>{
      if(G.explored[p.y] && G.explored[p.y][p.x]){
        ctx.fillStyle= p.burning? '#e8842c':'#c8a060';
        ctx.fillRect(ox+p.x*cw-1, oy+p.y*ch-1, 3.4,3.4);
      }
    });
  }
  // 出口
  if(G.exit && G.explored[G.exit.y] && G.explored[G.exit.y][G.exit.x]){
    ctx.fillStyle='#79b06a'; ctx.fillRect(ox+G.exit.x*cw-1.5, oy+G.exit.y*ch-1.5, 5,5);
    ctx.strokeStyle='rgba(120,200,120,.7)'; ctx.strokeRect(ox+G.exit.x*cw-1.5, oy+G.exit.y*ch-1.5, 5,5);
  }
  // 已见敌人/友军（只画 visible）
  G.mobs.forEach(m=>{
    if(m.dead) return;
    if(!(G.visible[m.y] && G.visible[m.y][m.x])) return;
    ctx.fillStyle = RELCOL[m.rel] || '#b8563a';
    const r = m.boss? 3.4 : 2.2;
    ctx.beginPath(); ctx.arc(ox+m.x*cw+cw/2, oy+m.y*ch+ch/2, r, 0,7); ctx.fill();
  });
  // 玩家
  ctx.fillStyle='#ffffff';
  ctx.beginPath(); ctx.arc(ox+G.px*cw+cw/2, oy+G.py*ch+ch/2, 2.8, 0,7); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(ox+G.px*cw+cw/2, oy+G.py*ch+ch/2, 5.4, 0,7); ctx.stroke();
  ctx.fillStyle='rgba(200,150,62,.6)'; ctx.font='9px serif'; ctx.textAlign='left';
  ctx.fillText('图', ox+3, oy+mh-4);
  ctx.restore();
}


/* 靠墙的环境道具：只画不改逻辑 */
function drawDeco(x,y,t){
  if(t!==0) return;
  const th=themeOf(), px=X(x), py=Y(y), h=hash2(x,y,55);
  if(h<0.72) return;
  const nearWall = (y>0 && G.tiles[y-1][x]===1) || (y<GH-1 && G.tiles[y+1][x]===1)
                || (x>0 && G.tiles[y][x-1]===1) || (x<GW-1 && G.tiles[y][x+1]===1);
  if(!nearWall) return;
  if(th==='camp'){
    if(h>0.92){
      ctx.strokeStyle='#7a6140'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(px+12,py+TS-4); ctx.lineTo(px+12,py+4); ctx.stroke();
      ctx.fillStyle='#8a2a22';
      ctx.beginPath(); ctx.moveTo(px+13,py+5); ctx.lineTo(px+24,py+9); ctx.lineTo(px+13,py+14); ctx.fill();
    } else {
      ctx.strokeStyle='#8a7444'; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(px+9,py+TS-5); ctx.lineTo(px+16,py+8); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px+20,py+TS-5); ctx.lineTo(px+14,py+8); ctx.stroke();
      ctx.fillStyle='#9a9484'; ctx.fillRect(px+13,py+5,3,4);
    }
  } else if(th==='town'){
    if(h>0.88){
      ctx.fillStyle='#4a4236'; ctx.beginPath(); ctx.ellipse(px+TS/2,py+TS/2+3,6,4.5,0,0,7); ctx.fill();
      ctx.fillStyle='#2a251c'; ctx.beginPath(); ctx.ellipse(px+TS/2,py+TS/2+2,4.6,3.4,0,0,7); ctx.fill();
    } else {
      ctx.fillStyle='#6a5a3c'; ctx.beginPath(); ctx.arc(px+TS/2,py+TS/2+2,5.4,0,7); ctx.fill();
      ctx.strokeStyle='#8a7448'; ctx.lineWidth=1.2; ctx.stroke();
    }
  } else if(th==='palace'){
    ctx.strokeStyle='#8a7040'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(px+13,py+TS-4); ctx.lineTo(px+13,py+10); ctx.stroke();
    drawFire(px+13, py+7, 2.4, nowT()+x*0.7);
  } else if(th==='granary'){
    ctx.fillStyle='#7a6634'; ctx.beginPath();
    ctx.moveTo(px+11,py+TS-5); ctx.lineTo(px+TS/2,py+9); ctx.lineTo(px+TS-11,py+TS-5); ctx.fill();
  } else if(th==='mountain'){
    ctx.fillStyle='#4a453a';
    ctx.beginPath(); ctx.arc(px+13,py+TS-8,3.4,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(px+19,py+TS-6,2.4,0,7); ctx.fill();
  } else if(th==='ford'){
    ctx.strokeStyle='rgba(150,170,110,.5)'; ctx.lineWidth=1.2;
    for(let i=0;i<4;i++){
      ctx.beginPath();
      ctx.moveTo(px+8+i*6, py+TS-4);
      ctx.lineTo(px+7+i*6+Math.sin(nowT()+i)*2, py+10);
      ctx.stroke();
    }
  }
}

function renderCanvas(){
  if(!G){ ctx.fillStyle='#0d0b08'; ctx.fillRect(0,0,cv.width,cv.height); return; }
  camX = clamp(G.px-Math.floor(VW/2), 0, GW-VW);
  camY = clamp(G.py-Math.floor(VH/2), 0, GH-VH);
  ctx.fillStyle='#0b0a07'; ctx.fillRect(0,0,cv.width,cv.height);

  const tms=nowT();
  // 屏幕震动
  if(G.shake && tms-G.shake < 0.22){
    const m=(0.22-(tms-G.shake))*22;
    ctx.save(); ctx.translate((Math.random()-.5)*m, (Math.random()-.5)*m);
  }

  const x0=Math.max(0,camX), x1=Math.min(GW,camX+VW+1);
  const y0=Math.max(0,camY), y1=Math.min(GH,camY+VH+1);

  // 未探之地：暗雾
  for(let y=y0;y<y1;y++){
    for(let x=x0;x<x1;x++){
      if(G.explored[y][x]) continue;
      const r=hash2(x,y,99);
      ctx.fillStyle=`rgba(46,40,29,${0.42+r*0.26})`;
      ctx.fillRect(X(x),Y(y),TS,TS);
    }
  }

  for(let y=y0;y<y1;y++){
    for(let x=x0;x<x1;x++){
      const vis=G.visible[y][x], exp=G.explored[y][x];
      if(!vis && !exp) continue;
      const t=G.tiles[y][x];
      if(t===1){ drawWall(x,y,vis); continue; }
      if(t===2){ drawWater(X(x),Y(y),x,y,tms,false); if(!vis){ ctx.fillStyle='rgba(6,6,8,.4)'; ctx.fillRect(X(x),Y(y),TS,TS);} continue; }
      if(t===T_SHALLOW){ drawWater(X(x),Y(y),x,y,tms,true); if(!vis){ ctx.fillStyle='rgba(6,6,8,.4)'; ctx.fillRect(X(x),Y(y),TS,TS);} continue; }
      drawGround(x,y,t,vis);
      if(vis) drawDeco(x,y,t);
      const px=X(x), py=Y(y);
      if(vis && t===T_TRAP){
        ctx.strokeStyle='rgba(138,74,42,.85)'; ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(px+9,py+9); ctx.lineTo(px+TS-9,py+TS-9);
        ctx.moveTo(px+TS-9,py+9); ctx.lineTo(px+9,py+TS-9); ctx.stroke();
      }
      if(vis && t===T_BOAT){
        ctx.fillStyle='#4a3520'; ctx.fillRect(px+5,py+10,TS-10,TS-20);
        ctx.strokeStyle='#8a6a3e'; ctx.lineWidth=2; ctx.strokeRect(px+5.5,py+10.5,TS-11,TS-21);
        ctx.strokeStyle='#6a5330'; ctx.beginPath();
        ctx.moveTo(px+TS/2,py+8); ctx.lineTo(px+TS/2,py+TS-8); ctx.stroke();
      }
      if(vis && t===T_DOOR){
        ctx.fillStyle='#5a4526'; ctx.fillRect(px+4,py+2,TS-8,TS-4);
        ctx.strokeStyle='#8a6a3e'; ctx.lineWidth=2; ctx.strokeRect(px+4.5,py+2.5,TS-9,TS-5);
        ctx.fillStyle='#c8963e'; ctx.beginPath(); ctx.arc(px+TS-9,py+TS/2,1.8,0,7); ctx.fill();
      }
      if(vis && t===T_BARREL){
        ctx.fillStyle='#4a3a22'; ctx.beginPath(); ctx.ellipse(px+TS/2,py+TS/2,TS/2-7,TS/2-5,0,0,7); ctx.fill();
        ctx.strokeStyle='#8a7040'; ctx.lineWidth=1.6;
        ctx.beginPath(); ctx.ellipse(px+TS/2,py+TS/2,TS/2-7,TS/2-5,0,0,7); ctx.stroke();
        ctx.strokeStyle='rgba(200,160,90,.35)';
        ctx.beginPath(); ctx.ellipse(px+TS/2,py+TS/2-2,TS/2-8,TS/2-7,0,0,7); ctx.stroke();
      }
      if(vis && t===T_ROCK){
        ctx.fillStyle='#3a352c';
        ctx.beginPath(); ctx.moveTo(px+4,py+TS-4); ctx.lineTo(px+TS*.4,py+5);
        ctx.lineTo(px+TS-5,py+TS-4); ctx.fill();
        ctx.fillStyle='rgba(150,140,120,.14)';
        ctx.beginPath(); ctx.moveTo(px+7,py+TS-7); ctx.lineTo(px+TS*.4,py+9); ctx.lineTo(px+TS*.46,py+TS-7); ctx.fill();
      }
      if(vis && t===T_HIGH){
        ctx.strokeStyle='rgba(200,180,130,.28)'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.moveTo(px+5,py+TS-5); ctx.lineTo(px+TS/2,py+5); ctx.lineTo(px+TS-5,py+TS-5); ctx.stroke();
        ctx.fillStyle='rgba(200,180,130,.07)'; ctx.fillRect(px+3,py+3,TS-6,TS-6);
      }
      if(vis && t===T_BRAZI){
        ctx.fillStyle='#33240f'; ctx.beginPath(); ctx.arc(px+TS/2,py+TS-6,6,0,7); ctx.fill();
        drawFire(px+TS/2, py+TS-8, 3.6, tms+x*0.4+y*0.3);
      }
      if(t===5){
        ctx.fillStyle='rgba(60,110,60,.14)'; ctx.fillRect(px+2,py+2,TS-4,TS-4);
        ctx.strokeStyle='#79b06a'; ctx.lineWidth=2; ctx.strokeRect(px+2.5,py+2.5,TS-5,TS-5);
        ctx.fillStyle='#9ad08a'; ctx.font='bold 16px serif'; ctx.textAlign='center';
        ctx.fillText('出', px+TS/2, py+TS/2+6);
      }
    }
  }

  // 可燃物
  G.props.forEach(p=>{
    if(!(G.explored[p.y] && G.explored[p.y][p.x])) return;
    const px=X(p.x), py=Y(p.y), vis=G.visible[p.y]&&G.visible[p.y][p.x];
    if(!vis) ctx.globalAlpha=.55;
    if(p.burning>=2){
      ctx.fillStyle='#241a10'; ctx.fillRect(px+2,py+2,TS-4,TS-4);
      ctx.fillStyle='rgba(120,110,100,.25)';
      for(let i=0;i<3;i++) ctx.fillRect(px+5+i*8, py+5+i*6, 6,6);
    } else if(p.burning===1){
      ctx.fillStyle='#2a1d12'; ctx.fillRect(px+2,py+2,TS-4,TS-4);
      drawFire(px+TS/2, py+TS/2, 6, nowT()+p.x);
    } else {
      ctx.fillStyle='#5a4a28'; ctx.fillRect(px+3,py+5,TS-6,TS-10);
      ctx.strokeStyle='#8a7a4a'; ctx.lineWidth=1; ctx.strokeRect(px+3.5,py+5.5,TS-7,TS-11);
      ctx.strokeStyle='rgba(30,24,14,.6)';
      for(let i=1;i<3;i++){ ctx.beginPath(); ctx.moveTo(px+4,py+5+i*8); ctx.lineTo(px+TS-4,py+5+i*8); ctx.stroke(); }
    }
    ctx.globalAlpha=1;
  });

  // 道具 / 随行
  G.items.forEach(it=>{
    if(it.dead) return;
    if(!(G.explored[it.y] && G.explored[it.y][it.x])) return;
    const px=X(it.x), py=Y(it.y);
    const vis=G.visible[it.y]&&G.visible[it.y][it.x];
    if(!vis) ctx.globalAlpha=.6;
    if(it.isEscort){
      ctx.fillStyle='#6a5a3e';
      drawFig(px+TS/2, py+TS/2, {s:1.02, cloth:'#6a5a3e', band:'#c8a060', wp:'none', armor:false, skin:'#d8b890'});
      if(it.taken && typeof it.hp==='number'){
        const w=TS*.78, h=3, bx=px+TS*.11, by=py+1;
        ctx.fillStyle='#33261c'; ctx.fillRect(bx,by,w,h);
        ctx.fillStyle='#7fae5a'; ctx.fillRect(bx,by,w*clamp(it.hp/Math.max(1,it.maxhp),0,1),h);
      }
    } else {
      // 包裹/卷轴
      ctx.fillStyle='rgba(216,192,112,.9)'; ctx.fillRect(px+10,py+13,TS-20,TS-22);
      ctx.strokeStyle='#6a5330'; ctx.lineWidth=1.6; ctx.strokeRect(px+10.5,py+13.5,TS-21,TS-23);
      ctx.strokeStyle='#a8823e'; ctx.beginPath();
      ctx.moveTo(px+TS/2,py+13); ctx.lineTo(px+TS/2,py+TS-9); ctx.stroke();
    }
    ctx.globalAlpha=1;
  });

  // 烟雾：扩散 + 消散
  if(G.smoke){
    const sm=G.smoke;
    const age=3-sm.t;
    for(let dy=-3;dy<=3;dy++) for(let dx=-3;dx<=3;dx++){
      const x=sm.x+dx, y=sm.y+dy;
      if(x<0||y<0||x>=GW||y>=GH) continue;
      const d=dist(x,y,sm.x,sm.y);
      if(d>(sm.r||2)+0.6) continue;
      const a=clamp(0.42 - age*0.09 - d*0.045, 0.04, 0.45);
      const spread = age*3.4;
      ctx.fillStyle=`rgba(150,144,128,${a})`;
      ctx.beginPath();
      ctx.arc(X(x)+TS/2, Y(y)+TS/2, TS*0.5 + spread + Math.sin(nowT()*2+x+y)*1.4, 0,7);
      ctx.fill();
    }
  }

  // 敌人
  G.mobs.forEach(m=>{
    if(m.dead) return;
    if(!(G.explored[m.y] && G.explored[m.y][m.x])) return;
    const vis=G.visible[m.y]&&G.visible[m.y][m.x];
    drawMobUnit(m);
    if(m.isTarget && vis){
      ctx.strokeStyle='rgba(200,150,62,.8)'; ctx.lineWidth=1.6;
      ctx.strokeRect(X(m.x)+1.5,Y(m.y)+1.5,TS-3,TS-3);
    }
  });

  // 玩家柔光
  const lx=X(G.px)+TS/2, ly=Y(G.py)+TS/2;
  const lg=ctx.createRadialGradient(lx,ly,TS*0.4,lx,ly,TS*3.2);
  lg.addColorStop(0,'rgba(255,226,170,.10)');
  lg.addColorStop(1,'rgba(255,226,170,0)');
  ctx.fillStyle=lg; ctx.beginPath(); ctx.arc(lx,ly,TS*3.2,0,7); ctx.fill();

  // 玩家
  drawPlayerUnit();

  // 悬停
  if(UI.hover && !UI.pending){
    ctx.strokeStyle='rgba(200,150,62,.55)'; ctx.lineWidth=1.5;
    ctx.strokeRect(X(UI.hover.x)+1,Y(UI.hover.y)+1,TS-2,TS-2);
  }

  // 可释放范围
  if(UI.mode==='aim'){
    const pulse=.5+Math.sin(nowT()*4)*.18;
    aimCells().forEach(c=>{
      const x=X(c.x), y=Y(c.y);
      const mm=mobAt(c.x,c.y);
      const ally=mm && mm.rel==='ally';
      ctx.fillStyle = ally? `rgba(201,163,68,${0.13*pulse+0.06})` : `rgba(140,200,120,${0.12*pulse+0.05})`;
      ctx.fillRect(x,y,TS,TS);
      ctx.strokeStyle= ally? 'rgba(201,163,68,.55)' : 'rgba(140,200,120,.36)';
      ctx.lineWidth=1; ctx.strokeRect(x+.5,y+.5,TS-1,TS-1);
    });
  }

  // 瞄准光标
  if(UI.cursor){
    const cxp=X(UI.cursor.x)+1, cyp=Y(UI.cursor.y)+1;
    ctx.strokeStyle = UI.aimOk? 'rgba(150,210,130,.95)' : 'rgba(208,90,58,.9)';
    ctx.lineWidth=2; ctx.strokeRect(cxp,cyp,TS-2,TS-2);
    ctx.beginPath();
    ctx.moveTo(cxp+TS/2,cyp); ctx.lineTo(cxp+TS/2,cyp+TS);
    ctx.moveTo(cxp,cyp+TS/2); ctx.lineTo(cxp+TS,cyp+TS/2);
    ctx.stroke();
    ctx.strokeStyle='rgba(200,150,62,.25)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(X(G.px)+TS/2,Y(G.py)+TS/2); ctx.lineTo(cxp+TS/2,cyp+TS/2); ctx.stroke();
  }

  // 震动恢复
  if(G.shake && tms-G.shake < 0.22) ctx.restore();

  drawFx();

  // 视野暗角
  const cx0=X(G.px)+TS/2, cy0=Y(G.py)+TS/2;
  const vg=ctx.createRadialGradient(cx0,cy0,TS*3,cx0,cy0,Math.max(cv.width,cv.height)*0.62);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.42)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,cv.width,cv.height);

  drawMini();
}

/* 动画循环：只在非暂停时重绘战场 */
function startLoop(){
  if(typeof requestAnimationFrame!=='function') return;
  const step=()=>{
    requestAnimationFrame(step);
    if(!G || UI.paused) return;
    renderCanvas();
  };
  requestAnimationFrame(step);
}

function shade(hex){
  // 简单压暗
  const n = parseInt(hex.slice(1),16);
  const r=Math.round(((n>>16)&255)*0.32), g=Math.round(((n>>8)&255)*0.32), b=Math.round((n&255)*0.32);
  return `rgb(${r},${g},${b})`;
}

/* ===== 交互 ===== */
function cellFromEvent(e){
  const rect = cv.getBoundingClientRect();
  const sx = cv.width/rect.width, sy = cv.height/rect.height;
  const x = Math.floor(((e.clientX-rect.left)*sx)/TS) + camX;
  const y = Math.floor(((e.clientY-rect.top)*sy)/TS) + camY;
  return {x,y};
}
function inMap(x,y){ return x>=0 && y>=0 && x<GW && y<GH; }

/* ---- 瞄准：目标选框 ---- */
function canAimAt(x,y){
  if(!G || !run || !inMap(x,y)) return false;
  const p = UI.pending;
  if(p === 'attack'){
    const m = mobAt(x,y);
    if(!m) return false;
    if(m.rel === 'ally') return false;                 // 快捷攻击永远不打自己人
    if(dist(G.px,G.py,x,y) > atkRange()) return false;
    if(run.cls==='bow' && !lineOfSight(G.px,G.py,x,y,G.tiles)) return false;
    return true;
  }
  const sk = SKILLS[p];
  if(!sk) return false;
  if(sk.target === 'self') return x===G.px && y===G.py;
  if(dist(G.px,G.py,x,y) > (sk.range||1)) return false;
  if(sk.target === 'enemy') return !!mobAt(x,y);       // 技能可以指向友军，但要二次确认
  if(sk.target === 'tile')  return tileAt(x,y) !== 1;
  return true;
}

/* 这一手能落在哪些格子上 —— 用来高亮范围，也用来限制选框 */
function aimCells(){
  if(!G || !run) return [];
  const p = UI.pending;
  const r = p==='attack' ? atkRange() : Math.max(1, (SKILLS[p] && SKILLS[p].range) || 1);
  const out = [];
  for(let y=Math.max(0,G.py-r); y<=Math.min(GH-1,G.py+r); y++)
    for(let x=Math.max(0,G.px-r); x<=Math.min(GW-1,G.px+r); x++)
      if(canAimAt(x,y)) out.push({x,y});
  return out;
}

function beginAim(p){
  if(!G || G.over || !run) return;
  if(p !== 'attack'){
    const sk = SKILLS[p];
    if(!sk || !run.skills.includes(p) || run.lv < sk.lv) return;
  }
  UI.mode = 'aim';
  UI.pending = p;
  const cells = aimCells();
  if(!cells.length){
    UI.mode='move'; UI.pending=null; UI.cursor=null;
    const msg = p==='attack' ? '手边没有可砍的人。' : '这一手此刻没有落点。';
    addLog(msg,'r');
    const h = document.getElementById('hint');
    if(h) h.textContent = msg;
    updateSkills();
    return;
  }
  let best = cells[0], bd = 1e9;
  cells.forEach(c=>{ const d = dist(G.px,G.py,c.x,c.y); if(d < bd){ bd=d; best=c; } });
  UI.cursor = {x:best.x, y:best.y};
  refreshAim();
}

function clearAim(){
  UI.mode='move'; UI.pending=null; UI.cursor=null; UI.aimOk=false;
  document.getElementById('hint').textContent='';
  updateSkills(); renderCanvas();
}

function refreshAim(){
  if(UI.mode!=='aim') return;
  UI.aimOk = canAimAt(UI.cursor.x, UI.cursor.y);
  const p = UI.pending;
  const nm = p==='attack' ? '普通攻击' : (SKILLS[p] ? SKILLS[p].name : '');
  const hint = document.getElementById('hint');
  const tgt = mobAt(UI.cursor.x, UI.cursor.y);
  hint.textContent = `${nm}　范围 ${aimCells().length} 格　方向键 / 鼠标移框　左键或 Enter 确认　ESC 取消`
    + (tgt && tgt.rel==='ally' ? '　（友军：需二次确认）' : '');
  updateSkills();
  renderCanvas();
}

function moveCursor(dx,dy){
  if(UI.mode!=='aim') return;
  const nx = clamp(UI.cursor.x+dx, Math.max(0,camX), Math.min(GW-1, camX+VW-1));
  const ny = clamp(UI.cursor.y+dy, Math.max(0,camY), Math.min(GH-1, camY+VH-1));
  if(!canAimAt(nx,ny)) return;          // 选框不许出范围
  UI.cursor = {x:nx, y:ny};
  refreshAim();
}

function confirmAim(){
  if(UI.mode!=='aim') return;
  const x = UI.cursor.x, y = UI.cursor.y;
  if(!canAimAt(x,y)){ addLog('那里不在范围里。','r'); return; }
  const tm = mobAt(x,y);
  if(tm && tm.rel === 'ally' && UI.pending !== 'attack'){
    showAllyConfirm(tm, ()=>executePending(x,y));
    return;
  }
  executePending(x,y);
}

function executePending(x,y){
  const p = UI.pending;
  if(p === 'attack'){
    const m = mobAt(x,y);
    UI.mode='move'; UI.pending=null; UI.cursor=null; UI.aimOk=false;
    document.getElementById('hint').textContent='';
    updateSkills();
    basicAttack(m);
    return;
  }
  const sk = SKILLS[p];
  let tx=x, ty=y;
  if(sk.target==='self'){ tx=G.px; ty=G.py; }
  const ok = useSkill(p, tx, ty);
  if(ok){
    UI.mode='move'; UI.pending=null; UI.cursor=null; UI.aimOk=false;
    document.getElementById('hint').textContent='';
  }
  updateSkills(); renderAll();
}

function showAllyConfirm(m, onYes){
  UI.paused = true;
  hideTip();
  ov(`<div class="tag">同室操戈</div>
    <h2>${m.name}</h2>
    <p class="lead">他是自己人。<br>这一下出手，他就再不是了。</p>
    <div style="margin-top:26px">
      <button class="btn" id="cf-yes">动手</button>
      <button class="btn" id="cf-no" style="margin-top:10px;background:#221a12;border-color:#4a3c2a">算了</button>
    </div>`);
  const yes = document.getElementById('cf-yes');
  const no  = document.getElementById('cf-no');
  if(yes) yes.onclick = ()=>{
    UI.paused=false; hideOv();
    m.rel = 'hostile';
    addLog(m.name+' 由友转敌，眼中已无旧情。','r');
    onYes();
  };
  if(no) no.onclick = ()=>{ UI.paused=false; hideOv(); renderAll(); };
}

/* ---- 鼠标 ---- */
cv.addEventListener('mousemove', e=>{
  if(!G || G.over || !run || UI.paused) return;
  const c = cellFromEvent(e);
  if(!inMap(c.x,c.y)){ UI.hover=null; hideTip(); return; }
  UI.hover = c;
  if(UI.mode==='aim'){
    if(canAimAt(c.x,c.y)) UI.cursor = {x:c.x,y:c.y};
    UI.aimOk = canAimAt(UI.cursor.x,UI.cursor.y);
    renderCanvas();
  }
  showTip(e,c);
});
cv.addEventListener('mouseleave', ()=>{ UI.hover=null; hideTip(); });

cv.addEventListener('click', e=>{
  if(!G || G.over || !run || UI.paused) return;
  const c = cellFromEvent(e);
  if(!inMap(c.x,c.y)) return;

  if(UI.mode==='aim'){
    if(!canAimAt(c.x,c.y)){ addLog('那里不在范围里。','r'); return; }
    UI.cursor = {x:c.x,y:c.y};
    UI.aimOk = true;
    confirmAim();
    return;
  }
  if(c.x===G.px && c.y===G.py){ addLog('你按住不动。',''); endTurn(); return; }

  const dx = c.x-G.px, dy = c.y-G.py;
  const adj = Math.max(Math.abs(dx),Math.abs(dy))===1;

  if(adj){
    const m = mobAt(c.x,c.y);
    if(m){
      if(m.rel==='ally'){ addLog('那是自己人。右键看看，别乱砍。','r'); return; }
      basicAttack(m); return;
    }
    movePlayer(dx,dy);
    return;
  }
  const m = mobAt(c.x,c.y);
  if(m && dist(G.px,G.py,c.x,c.y) <= atkRange()){ basicAttack(m); return; }
  addLog('够不着。按 F 开瞄准，或先走近。','r');
});

cv.addEventListener('contextmenu', e=>{
  e.preventDefault();
  if(!G || G.over || !run) return;
  const c = cellFromEvent(e);
  if(!inMap(c.x,c.y)) return;
  const m = mobAt(c.x,c.y);
  if(m && G.visible[m.y] && G.visible[m.y][m.x]) showMobSheet(m);
  else if(c.x===G.px && c.y===G.py) showPanel('char');
});

/* ---- 键盘 ---- */
const MVKEYS = {w:[0,-1], s:[0,1], a:[-1,0], d:[1,0], q:[-1,-1], e:[1,-1], z:[-1,1], c:[1,1]};

document.addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();

  if(UI.paused){
    if(k==='escape' || k==='tab'){ e.preventDefault(); closePanel(); return; }
    if(k==='i'||k==='b'||k==='k'||k==='j'){
      showPanel(k==='i'?'char':k==='b'?'bag':k==='k'?'skills':'quest');
      return;
    }
    return;
  }
  if(!G || G.over || !run) return;

  if(k==='tab'){ e.preventDefault(); showPanel('char'); return; }
  if(k==='i'){ showPanel('char'); return; }
  if(k==='b'){ showPanel('bag'); return; }
  if(k==='k'){ showPanel('skills'); return; }
  if(k==='j'){ showPanel('quest'); return; }

  if(UI.mode==='aim'){
    if(k==='escape'){ e.preventDefault(); clearAim(); return; }
    if(k==='enter' || k===' '){ e.preventDefault(); confirmAim(); return; }
    const ad = MVKEYS[k];
    if(ad){ e.preventDefault(); moveCursor(ad[0],ad[1]); return; }
    if(k==='arrowup'){ e.preventDefault(); moveCursor(0,-1); return; }
    if(k==='arrowdown'){ e.preventDefault(); moveCursor(0,1); return; }
    if(k==='arrowleft'){ e.preventDefault(); moveCursor(-1,0); return; }
    if(k==='arrowright'){ e.preventDefault(); moveCursor(1,0); return; }
    if(k>='1' && k<='6'){
      const id = run.skills[parseInt(k)-1];
      if(!id) return;
      if(run.lv < SKILLS[id].lv){ addLog('这一手还没练成。','r'); return; }
      beginAim(id);
      return;
    }
    return;
  }

  if(k==='escape'){ e.preventDefault(); UI.paused=true; showSettings(true); return; }
  if(k==='m'){ SET.mute=!SET.mute; saveSet(); addLog(SET.mute?'静了。':'有声了。',''); return; }

  const mv = MVKEYS[k];
  if(mv){
    e.preventDefault();
    const tx = G.px+mv[0], ty = G.py+mv[1];
    const m = mobAt(tx,ty);
    if(m){
      if(m.rel==='ally'){ addLog('挡在前面的，是自己人。','r'); return; }
      basicAttack(m); return;
    }
    movePlayer(mv[0],mv[1]);
    return;
  }
  if(k==='arrowup'){ e.preventDefault(); movePlayer(0,-1); return; }
  if(k==='arrowdown'){ e.preventDefault(); movePlayer(0,1); return; }
  if(k==='arrowleft'){ e.preventDefault(); movePlayer(-1,0); return; }
  if(k==='arrowright'){ e.preventDefault(); movePlayer(1,0); return; }

  if(k==='f'){ beginAim('attack'); return; }
  if(k==='g'){ tryEscape(); return; }
  if(k==='r'){
    run.st = clamp(run.st+8,0,run.stmax);
    G.alarm = clamp(G.alarm+2,0,4);
    addLog('你喘了口气。','y');
    endTurn();
    return;
  }
  if(k===' ' || k==='x'){ e.preventDefault(); endTurn(); return; }
  if(k>='1' && k<='6'){
    const id = run.skills[parseInt(k)-1];
    if(id) beginAim(id);
  }
});

  TIP.innerHTML = `

}
