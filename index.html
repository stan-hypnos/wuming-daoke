<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>无名刀客 · 三国</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2312100c'/%3E%3Cpath d='M16 5 L20 15 L16 27 L12 15 Z' fill='%23c8963e'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#12100c; --panel:#1b1712; --panel2:#221d16;
  --line:#3a3023; --ink:#d9cdb0; --dim:#8d8069;
  --bronze:#c8963e; --blood:#b8563a; --jade:#6f9e6a; --fire:#e8842c;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
#app{
  position:relative;
  width:min(96vw,1340px); height:min(96vh,820px);
  display:flex; flex-direction:column;
  background:var(--panel); border:1px solid var(--line);
  box-shadow:0 24px 80px rgba(0,0,0,.8);
}
#topbar{
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  padding:8px 16px; border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#241e16,#1a1510);
  font-size:13px; letter-spacing:.5px;
}
#topbar .tb{display:flex; align-items:baseline; gap:6px; white-space:nowrap}
#topbar .tb b{font-family:"SF Mono",Menlo,monospace; font-size:14px; color:var(--bronze); font-weight:600}
#topbar .sep{width:1px; height:18px; background:var(--line)}
main{flex:1; display:flex; min-height:0; overflow:hidden}
#keybar{
  flex:0 0 auto; display:flex; flex-wrap:wrap; gap:4px 15px; align-items:center;
  padding:7px 16px; border-top:1px solid var(--line);
  background:linear-gradient(180deg,#1a1510,#15110c);
  font-size:11.5px; color:#7d7160; letter-spacing:.3px;
}
#keybar b{color:#bb9d6b; font-weight:600; font-family:"SF Mono",Menlo,monospace; font-size:11.5px; margin-right:3px}
#left{flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; padding:10px; gap:8px}
#cv{width:auto; height:auto; max-width:100%; max-height:100%; margin:0 auto; display:block; background:#0d0b08; border:1px solid var(--line); cursor:crosshair; image-rendering:pixelated}
#hint{font-size:12px; color:var(--dim); height:16px; white-space:nowrap; overflow:hidden}
#side{
  width:300px; flex-shrink:0; border-left:1px solid var(--line);
  display:flex; flex-direction:column; background:var(--panel2);
}
#side h3{font-size:12px; color:var(--dim); font-weight:400; letter-spacing:3px; padding:10px 12px 6px}
#skills{padding:0 10px 10px; display:grid; gap:5px}
.skill{
  border:1px solid var(--line); background:#1a1510; padding:6px 8px;
  font-size:12px; cursor:pointer; display:flex; justify-content:space-between; gap:6px;
  transition:background .12s,border-color .12s;
}
.skill:hover{background:#231c14; border-color:var(--bronze)}
.skill.on{border-color:var(--bronze); background:#2b2216; box-shadow:inset 0 0 0 1px var(--bronze)}
.skill.dead{opacity:.35; cursor:not-allowed}
.skill .nm{color:var(--ink)}
.skill .cs{font-family:"SF Mono",Menlo,monospace; color:var(--dim); font-size:11px}
#log{
  flex:1; overflow-y:auto; padding:8px 12px; font-size:12.5px; line-height:1.7;
  border-top:1px solid var(--line);
}
#log p{margin:2px 0; color:var(--dim)}
#log p.hi{color:var(--ink)}
#log p.g{color:var(--jade)}
#log p.r{color:var(--blood)}
#log p.y{color:var(--bronze)}
#overlay{
  position:absolute; inset:0; display:none; z-index:20;
  background:radial-gradient(ellipse at 50% 40%,#1a140e,#060504);
  overflow-y:auto; padding:36px 32px;
}
#overlay.show{display:block}
.wrap{max-width:720px; margin:0 auto}
.tag{font-size:11px; letter-spacing:4px; color:var(--bronze); margin-bottom:10px}
h1{font-size:34px; letter-spacing:8px; font-weight:400; margin-bottom:6px; color:#efe4c8}
h2{font-size:19px; letter-spacing:3px; font-weight:400; margin-bottom:14px; color:#efe4c8}
.lead{font-size:14px; line-height:2; color:#b6a988; margin-bottom:22px}
.opt{
  border:1px solid var(--line); background:#1a1510; padding:14px 16px; margin-bottom:10px;
  cursor:pointer; transition:all .15s;
}
.opt:hover{border-color:var(--bronze); background:#241d15; transform:translateX(3px)}
.opt .t{font-size:15px; color:#e8dcc0; margin-bottom:5px}
.opt .d{font-size:12.5px; color:var(--dim); line-height:1.7}
.opt .m{font-size:11px; color:var(--bronze); margin-top:6px; font-family:"SF Mono",Menlo,monospace}
.clsgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:20px}
.cls{border:1px solid var(--line); background:#1a1510; padding:16px; cursor:pointer; text-align:center; transition:all .15s}
.cls:hover{border-color:var(--bronze); background:#241d15}
.cls .n{font-size:19px; letter-spacing:4px; margin-bottom:8px}
.cls .w{font-size:11px; color:var(--bronze); margin-bottom:10px}
.cls .s{font-size:12px; color:var(--dim); line-height:1.7; text-align:left}
.btn{
  display:inline-block; border:1px solid var(--bronze); color:var(--bronze);
  padding:9px 26px; font-size:14px; letter-spacing:3px; cursor:pointer; background:transparent;
  font-family:inherit; transition:all .15s;
}
.btn:hover{background:var(--bronze); color:#12100c}
.stats{display:grid; grid-template-columns:repeat(2,1fr); gap:6px; margin:18px 0}
.st{display:flex; justify-content:space-between; border-bottom:1px solid var(--line); padding:7px 4px; font-size:13px}
.st b{font-family:"SF Mono",Menlo,monospace; color:var(--bronze)}
.epi{font-size:15px; line-height:2.2; color:#c9bb9c; border-left:2px solid var(--bronze); padding-left:16px; margin:18px 0}
@media(max-width:900px){
  main{flex-direction:column}
  #left{flex:1 1 auto}
  #cv{max-height:calc(100% - 26px)}
  #side{width:auto; border-left:none; border-top:1px solid var(--line); height:152px; max-height:152px; overflow:auto}
  #keybar{gap:4px 11px; font-size:11px; padding:6px 12px}
  #keybar b{font-size:11px}
  .clsgrid{grid-template-columns:1fr}
}
#tip{
  position:fixed; z-index:40; display:none; pointer-events:none;
  background:rgba(18,15,10,.97); border:1px solid var(--line);
  padding:8px 11px; font-size:12px; line-height:1.65; max-width:280px;
  box-shadow:0 8px 26px rgba(0,0,0,.7);
}
#tip .tn{color:#e8dcc0}
#tip .tr{color:#8d8069; font-size:11px; letter-spacing:1px}
#tip .bar{height:4px; background:#3a1a1a; margin:3px 0 6px}
#tip .bar i{display:block; height:4px; background:#b8563a}
#tb-alarm.pulse{animation:alarmP .9s ease-in-out 2}
@keyframes alarmP{0%,100%{color:inherit;transform:scale(1)}35%{color:#e8842c;transform:scale(1.22)}}
#cv{object-fit:contain}
@media(max-width:900px){
  #side{height:118px; max-height:118px}
  #log{font-size:11.5px; line-height:1.5}
  #skills{max-height:44px; overflow:auto}
  #topbar{gap:8px; font-size:11px}
  #keybar{font-size:10.5px; gap:3px 8px; padding:5px 8px}
}
.tabs{display:flex; gap:8px; margin-bottom:18px; border-bottom:1px solid var(--line); padding-bottom:10px}
.tab{padding:6px 16px; font-size:13px; letter-spacing:2px; cursor:pointer; border:1px solid var(--line); color:var(--dim)}
.tab.on{border-color:var(--bronze); color:var(--bronze); background:#241d15}
.row{display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:5px 0; border-bottom:1px solid rgba(58,48,35,.6)}
.row b{font-family:"SF Mono",Menlo,monospace; color:var(--bronze); font-weight:500}
.itm{border:1px solid var(--line); background:#1a1510; padding:8px 12px; margin-bottom:6px; font-size:12.5px; display:flex; justify-content:space-between; gap:8px}
.itm .a{color:var(--bronze); cursor:pointer}
.skrow{border:1px solid var(--line); background:#1a1510; padding:9px 12px; margin-bottom:6px; font-size:12.5px}
.skrow .h{display:flex; justify-content:space-between; margin-bottom:3px}
.skrow .plus{color:var(--bronze); cursor:pointer; font-family:"SF Mono",monospace}
</style>

<style id="wm-en-css">
body.wm-en{font-family:"Georgia","Times New Roman",serif}
</style>

<div id="app">
  <header id="topbar">
    <div class="tb">年份 <b id="tb-year">184</b></div><span class="sep"></span>

<script>
/* ===== Nameless Blade i18n runtime layer ===== */
(function(){
  var K = 'wm_lang';
  var Q = (location.search.match(/[?&]lang=(zh|en)/) || [])[1];
  var L = Q || localStorage.getItem(K);
  if (L !== 'zh' && L !== 'en') L = /^zh/i.test(navigator.language || '') ? 'zh' : 'en';
  window.WM_LANG = L;
  var DICT = {"董卓入京，废立在天。宫里一夜之间换了主人，少帝被押在北宫。有人出钱，要一块玉，和一封能证明这玉从哪来的信。": "Dong Zhuo enters the capital and decides who sits on the throne. The palace changes masters overnight and the young emperor is held in the North Palace. Someone is paying for a piece of jade — and a letter proving where it came from.", "郿坞的火烧了两天。董卓死了，长安乱了半年，然后李傕、郭汜又打起来。你换掉的不是结局，只是让乱世换了个面孔。": "Mei Fort burned for two days. Dong Zhuo died, Chang'an fell into half a year of chaos, then Li Jue and Guo Si went to war. You didn't change the ending — you just gave the age a different face.", "吕布死在你还刀的那一夜。曹操少了最怕的那个人，徐州提前几年归了他。史书不会记你的名字，只记了他的死期。": "Lü Bu died the night you turned your blade. Cao Cao lost the man he feared most and Xuzhou came to him years early. The histories will not record your name, only the date of his death.", "天子还坐在那把椅子上。曹操没有称公，袁绍没有南下。你替汉室挡下的这几年，让这个朝代多撑了一代人。": "The Son of Heaven still sits in that chair. Cao Cao never took the title of duke; Yuan Shao never marched south. The years you bought for the Han let the dynasty last one more generation.", "张梁据广宗，城坚兵厚。他每日遣传令出城调兵，一日三骑。杀了这三骑，城里的兵就不知道该往哪走。": "Zhang Liang holds Guangzong: thick walls, deep ranks. Every day he sends riders out to move troops — three a day. Kill those three and the garrison won't know where to go.", "官渡之后，袁绍崩了。你烧的那把火，或者你守住的那堆粮，让这一天早到了几年。三分之势，已成。": "After Guandu, Yuan Shao collapsed. The fire you set, or the grain you held, brought that day forward by years. The three-way split is already here.", "联军在酸枣扎了三个月，粮台堆得比营帐还高。谁在管这些粮，账上写得漂亮，仓里不一定有。": "The coalition sat at Suanzao for three months; the grain depot grew taller than the tents. Whoever keeps those books keeps them neat — the granary may not agree.", "吕布还活着。他不是能治天下的人，但他能让所有人更晚统一。这也许才是你真正做过的事。": "Lü Bu is still alive. He can't govern a realm, but he can delay everyone's unification. Maybe that is what you actually did.", "天子还在洛阳。洛阳已经没有城了。杨奉、董承的人马各怀心思，而曹操在许，等一句话。": "The emperor is still in Luoyang. Luoyang is no longer a city. Yang Feng and Dong Cheng each want something else, and Cao Cao waits in Xu for one sentence.", "天子在许，宫墙是新修的，墙里的人是旧的。有人要烧宫，有人要劫狱，有人只是想活着。": "The emperor is in Xu. The palace walls are new; the people inside are old. Some want to burn the palace, some want to break the jail, some just want to live.", "刘备没有丢徐州。百姓认他，你替他守过城门。三分之后，蜀汉的版图比史书上的大一些。": "Liu Bei did not lose Xuzhou. The people trust him — you held the gate for him. After the three-way split, Shu's borders run wider than the histories say.", "十六年里，你活下来了，但天下没因你动过一寸。你只是那个时代里一个会杀人的普通人。": "Sixteen years, and you survived. The world did not move an inch for you. You were just a man in that age who could kill.", "关前十八路诸侯，关后是华雄。你要杀的不是华雄——是他身边那个知道粮道在哪的人。": "Eighteen lords before the pass; Hua Xiong behind it. The man you have to kill isn't Hua Xiong — it's the one beside him who knows where the grain road runs.", "公孙瓒的白马义从，天下精骑。袁绍在界桥结阵，鞠义的八百先登，要挡住这几千骑兵。": "Gongsun Zan's White Horse Volunteers, the finest cavalry in the realm. Yuan Shao arrays at Jieqiao; Ju Yi's eight hundred vanguard must stop thousands of horsemen.", "谁也没赢。天下碎成七八块，谁也吞不下谁。你在其中活过，像很多人一样，然后死了。": "Nobody won. The realm shattered into seven or eight pieces and none could swallow the rest. You lived through it, like many, and then you died.", "淳于琼守乌巢，粮全在这里。曹操亲率五千人，夜行百里。这一夜，决定了往后十年。": "Chunyu Qiong holds Wuchao and all the grain is here. Cao Cao leads five thousand men a hundred li by night. This one night decides the next ten years.", "曹操攻濮阳，吕布守。城外三十里，曹军的粮车每天来一次，护送的只有一队骑兵。": "Cao Cao attacks Puyang and Lü Bu holds it. Thirty li out, Cao's grain carts come once a day, escorted by a single troop of horsemen.", "曹操东征，徐州十县被屠。有人说这是复仇，有人说这是粮道。城里还有人在等。": "Cao Cao marches east and ten counties of Xuzhou are put to the sword. Some call it revenge, some call it the grain road. There are still people in the city, waiting.", "你在汜水关赢过一阵，曹营里已经有人认得你这张脸——这既是好事，也是祸事。": "You won a skirmish at Sishui, and men in Cao's camp know your face now — that is both an advantage and a curse.", "袁绍的将在堂上吵了三天。张郃坐在最末，一句话没说过。他帐下的兵，还有粮。": "Yuan Shao's generals have argued in the hall for three days. Zhang He sits at the far end and has said nothing. His men still have grain.", "二月，黄巾波才围长社。皇甫嵩兵少，营中皆恐。夜里风起，火可以烧三十里。": "Second month: the Yellow Turban Bo Cai surrounds Changshe. Huangfu Song's army is small and the camp is afraid. The wind rises at night; fire can run thirty li.", "城破在即。你要在官军合围之前，把西门的守军引开——然后从里面杀出来。": "The city will fall soon. Before the imperial army closes the ring, you must pull the west gate garrison away — then cut your way out from inside.", "袁绍的粮，存在邺城外的营里。守粮的督官每十日换一次人。这一任，姓陈。": "Yuan Shao's grain sits in camps outside Ye. The grain officer is replaced every ten days. This one is named Chen.", "董卓住在郿坞，甲士三千，出门要清道。王允在朝上说笑，回家就把门关上。": "Dong Zhuo lives in Mei Fort with three thousand guards and clears the streets when he travels. Wang Yun jokes in court, then locks his door at home.", "一个孩子，一辆车，一队追兵。你要把车赶到城门口，再从别的门出去。": "A child, a cart, a column of pursuers. You have to drive the cart to the gate — and leave by a different one.", "粮车二十辆，停在关北。你烧两辆就够了——剩下十八辆会跟着一起烧。": "Twenty grain wagons parked north of the pass. Burning two is enough — the other eighteen will follow.", "他在关下列阵叫战。诸侯无人敢应。你要从营后摸进去，趁他披甲未齐。": "He arrays below the pass and calls for a duel. No lord dares answer. You go in from behind the camp, while his armor is still half-laced.", "你进过一次北宫，认得那条路。相府的墙比宫墙还高，守卫却一样会困。": "You have been inside the North Palace once; you know the way. The chancellor's walls are higher than the palace walls, but the guards still get sleepy.", "风大，火一起就收不住。你要在火里摸到营心，点着它，再活着出来。": "The wind is strong; once fire starts it won't stop. Reach the heart of the camp through the fire, light it, and come out alive.", "门在水下。钥匙在守将身上。你只有一次机会。白门楼上，温侯还在。": "The gate is underwater. The key is on the garrison commander. You get one chance. Up on the White Gate tower, the Marquis is still waiting.", "袁绍没有崩。北方还是他的。天下分裂的时间，因为你，又长了十年。": "Yuan Shao did not collapse. The north is still his. The realm stays divided ten years longer because of you.", "白马义从的马脚在桥头。你要在桥头摸进去，把领骑的校尉斩了。": "The White Horse riders rein up at the bridgehead. Slip in there and cut down the officer leading them.", "三个粮堆，一队纵火兵，和一整夜的警报。守住粮，袁绍就不崩。": "Three grain stacks, a squad of arsonists, and a whole night of alarms. Hold the grain and Yuan Shao does not break.", "黄巾缺粮。官军的粮屯在营后，守得不严——至少今夜不严。": "The Yellow Turbans are short of grain. The imperial army's stores sit behind the camp, lightly held — at least tonight.", "从洛阳到许，中间是三百里无人区，和几支不知归属的兵马。": "From Luoyang to Xu lies three hundred li of empty land, and several columns whose allegiance nobody knows.", "袁营里已经有人在传粮草不够。守粮的人，比攻的人更想跑。": "In Yuan's camp they already whisper that the grain won't last. The men guarding it want to run more than the men attacking.", "摸进粮营，点燃两个粮堆，然后从北道出去。火会替你喊人。": "Slip into the grain camp, torch two stacks, leave by the northern road. The fire will do your shouting.", "北宫三进院落，每进都有甲士。玺在最后一进。拿了就走。": "The North Palace has three courtyards and guards in every one. The seal is in the last. Take it and go.", "曹操围了三个月，城里有水，没有粮。吕布还在白门楼上。": "Cao Cao has besieged it three months; the city has water, not grain. Lü Bu is still on the White Gate tower.", "官军给了你通行的一枚木牌。进去容易，出来要有人信你。": "The imperial army gave you a wooden pass. Getting in is easy; getting out needs someone to vouch for you.", "城里的百姓认得你。他们肯听你一句话，也肯替你挡一挡。": "The people of the city know you. They will listen to one sentence from you — and take a blow for you.", "不犯错的职业。一次断连，势掉光，你就成了普通步兵。": "A class for people who don't make mistakes. Break the chain once, lose every point of Momentum, and you are ordinary infantry.", "倾尽准头。伤害 = 准 × 2.5，出手后准归零。": "Spend every point of Aim. Damage = Aim × 2.5; Aim resets to zero after the shot.", "温侯信得过你，才把北门交给你。守到天亮，他就能走。": "The Marquis trusts you enough to hand you the north gate. Hold it till dawn and he can leave.", "十几个人，一辆车装不下。你只能带走最要紧的那几个。": "A dozen people and one cart. You can only take the ones who matter most.", "从暗处出刀。隐蔽时伤害×2.5，出手后脱离隐蔽。": "Strike from the dark: ×2.5 damage while concealed, and you lose concealment when you strike.", "倾尽所有势。伤害 = 势 × 3，出手后势归零。": "Spend all Momentum. Damage = Momentum × 3; Momentum resets to zero.", "三个传令，不同路线，同一座城。你只够时间杀一个。": "Three couriers, three routes, one city. You have time to kill one.", "华雄在中军，军需官在关后粮道。这两处隔着整座关。": "Hua Xiong is in the main camp; the quartermaster is on the grain road behind the pass. An entire fortress between them.", "信在怀里的分量，比刀重。你只有走出去，它才有用。": "A letter against your chest weighs more than a blade. It only matters if you get out.", "粮营被小股人马袭扰。你要守三个粮堆，撑到援军到。": "The grain camp is being raided by small bands. Hold three stacks until reinforcements arrive.", "车轮压过土路的声音，比人先到。你只需点第一把火。": "The sound of wheels on dirt arrives before the men do. You only need to light the first fire.", "三个人各有各的算盘。你要让他们相信，明天还有粮。": "Three men, three calculations. You have to make them believe there will be grain tomorrow.", "割开血脉，每回合流血 8 点，持续 4 回合。": "Open an artery: 8 bleed per turn for 4 turns.", "鸣镝惊营。警觉+3，却把八格内的敌人引向落点。": "A whistling arrow wakes the camp. Alarm +3, but it pulls enemies within eight tiles toward the impact.", "城门的守军只有二十人，但你知道他们换班的时候。": "The gate has only twenty guards — but you know when they change shifts.", "三个人，一匹马，六十个追兵。从北门出去，往东。": "Three men, one horse, sixty pursuers. Out the north gate, then east.", "没人认得你。你从哪边都能进，也从哪边都出不来。": "Nobody knows you. You can get in from any side — and out of none.", "袁本初要知道曹孟德的粮从哪来。你只要画一张图。": "Yuan Benchu wants to know where Cao Mengde's grain comes from. All you have to do is draw a map.", "他不想反，但他也不想死。你只要把他带出这座营。": "He doesn't want to rebel, but he doesn't want to die either. You just have to get him out of this camp.", "山路只剩一两格宽，两侧岩石挡视线，隘口最难走。": "The mountain road narrows to one or two tiles; rock walls block sight and the pass is the worst of it.", "潜行、背刺、消失。一旦被发现，你就只剩一半。": "Stealth, backstab, vanish. Once you're seen, half your kit is gone.", "原地不动，势+15。下回合首击伤害+50%。": "Stand still: Momentum +15. First strike next turn deals +50%.", "诏书在宫里第三进。写下它的人，已经不打算活。": "The edict waits in the palace's third courtyard. The man who wrote it no longer expects to live.", "向前刺出，击中 2 格内的目标。命中得势。": "Thrust forward, hitting a target within 2 tiles. A hit grants Momentum.", "一枪贯穿直线三格内所有敌人，各受七成伤害。": "One thrust pierces every enemy in a straight line of three tiles, each taking 70%.", "桥断了。公孙瓒困在东岸，桥头全是袁绍的枪。": "The bridge is down. Gongsun Zan is trapped on the east bank and the bridgehead is all Yuan spears.", "刘备账上的粮只够七天。断了他，徐州就完了。": "Liu Bei's books show seven days of grain. Cut it and Xuzhou is finished.", "没人认得你。这是你唯一比吕布占便宜的地方。": "Nobody knows you. It is the only advantage you hold over Lü Bu.", "你身上有汉室的腰牌，曹营的斥候见了会让路。": "You carry a Han token; Cao's scouts step aside when they see it.", "营帐连着火盆，营门一开就是三横两纵的营道。": "Tents strung around fire pits; open the gate and the camp runs in rows.", "街道被民居切成一条条巷子，城门后面全是墙。": "Houses cut the streets into alleys; behind the gate it is all walls.", "靠不动吃饭。敌人贴脸，你一动，准就归零。": "You earn your living by not moving. Step once with an enemy in your face and Aim is gone.", "在周身扬烟，3回合内阻断视线。撤离专用。": "Raise smoke around yourself: sight blocked for 3 turns. Made for leaving.", "守住脚下，防御+6，三回合内不能被推开。": "Hold your ground: +6 defense, cannot be pushed for three turns.", "营中一千人，督粮的只有一个。他睡在中帐。": "A thousand men in the camp and one grain officer. He sleeps in the middle tent.", "没人知道是你。但两边都会想让你永远闭嘴。": "Nobody knows it was you — which is why both sides will want you silent forever.", "四座仓房围出空地，粮堆密，木桶一点就炸。": "Four granaries ring an open yard, stacks packed tight, barrels one spark from blowing.", "长廊横贯，宫殿各自成院，宫门后是禁地。": "A long corridor crosses the palace; each hall its own courtyard, forbidden ground behind the gates.", "城里有几处门、几处粮，曹操出得起价。": "The city has a few gates and a few granaries — and Cao Cao can pay.", "泼出去，点火就烧——身边两格内的粮。": "Throw it and light it — grain within two tiles of you burns.", "河横在中间，浅滩踩水慢，桥上才好过。": "The river cuts across; shallows slow you and the bridge is the only clean crossing.", "到了出口。按 G 撤离，或继续留下。": "You are at the exit. Press G to withdraw, or stay.", "本回合减伤一半，并对近身来敌反击。": "Halve damage this turn and counter anyone who closes on you.", "袁军军心散了，有人握着枪不肯上前。": "Yuan's morale is cracking; some men hold their spears and will not step forward.", "温侯的骑队就在左近，随时会踏进来。": "The Marquis's horsemen are close by and may ride in at any moment.", "刀身有缺口，每一道都是别人的骨头。": "The blade is notched, and every notch is someone's bone.", "一丈二的长戟，画彩为饰，重得压手。": "A twelve-foot halberd, painted and ornamented, heavy enough to drag your hands down.", "伤害 +25%，每步多耗 1 体力": "Damage +25%, +1 stamina per step", "接上了要送的人。带上他，往出口走。": "You have picked up the person you came for. Take him to the exit.", " 记下了这一刀——他把你当敌人了。": "  remembers this strike — he counts you as an enemy now.", "够不着。按 F 开瞄准，或先走近。": "Out of reach. Press F to aim, or close the distance first.", "暗处出手 3 倍，二级 3.4 倍": "×3 damage from the dark; 3.4× at rank two", "进入隐蔽。被敌人视线扫到即解除。": "Enter concealment. Broken the moment an enemy's sight touches you.", "后撤一格再放箭。这一箭不消耗准。": "Step back one tile and loose. This arrow costs no Aim.", "射出一支燃矢，点燃落点周围一格。": "Loose a burning arrow; sets the impact tile and its neighbours alight.", "一息两箭，各六成伤害，准-20。": "Two arrows in one breath, 60% each, Aim -20.", "甲片镀金，穿在身上像背着一口锅。": "Gilded plates; wearing it is like carrying a pot on your back.", "脚下崩了一下——是猎户的套索。-": "The ground gives way — a hunter's snare.-", "断开所有敌人的锁定，退回暗处。": "Break every enemy's lock and slip back into the dark.", "抡刀蓄力，要一刀把人劈成两半。": "Wind up the blade to cut a man in half.", "随行的人倒下了。这一趟白走了。": "The man you were escorting is down. This trip was for nothing.", "干净利落。没人看见，也没人追。": "Clean. Nobody saw, nobody followed.", "那是自己人。右键看看，别乱砍。": "That one is ours. Right-click to look before you swing.", "身边没有可烧的东西，油还留着。": "Nothing to burn nearby — keep the oil.", "烟区扩到 2 格，二级 3 格": "Smoke spreads to 2 tiles; 3 at rank two", "点燃范围 1 格，二级 2 格": "Ignition radius 1 tile; 2 at rank two", "曹军势大，阵中多了一名亲卫。": "Cao's army   var PHRASES = Object.keys(DICT).filter(function(k){ return k.length >= 2 && !/^[A-Za-z]/.test(k); })

    PRE = new RegExp(PHRASES.map(function(k){ return k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|'), 'g');
  } catch(e) { PRE = null; }

  function runsLookup(s){
    return s.replace(/[\u4e00-\u9fff][\u4e00-\u9fff\s·，。、：；！？（）「」0-9%+\-\/]*/g, function(run){
      var t = run.replace(/\s+$/, '');

      if (DICT[t] != null) return DICT[t];
      var t2 = t.replace(/\s+/g, '');
      if (DICT[t2] != null) return DICT[t2];

    });

    if (window.WM_LANG !== 'en' || typeof s !== 'string' || !s) return s;
    if (DICT[s] != null) return DICT[s];
    if (!CJK.test(s)) return s;
    var i, m, tr2 = s.replace(/^\s+|\s+$/g, '');

      m = tr2.match(PAT[i][0]);
      if (m) { var o = PAT[i][1](m); if (!CJK.test(o)) return o; }
    }
    var t = tr2;
    if (DICT[t] != null) return s.replace(t, DICT[t]);
    var tn = s.replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, '');
    if (DICT[tn] != null) return DICT[tn];
    if (PRE) s = s.replace(PRE, function(k){ return DICT[k]; });
    s = runsLookup(s);
    return s;
  }
  window.WM_TR = tr;

  function txNode(n){
    if (n.__wm) return;
    var p = n.parentNode;
    if (p && SKIP[p.tagName]) return;
    var raw = n.nodeValue;
    if (!raw || !CJK.test(raw)) return;
    var t = tr(raw);
    if (t !== raw) { n.__wm = true; n.nodeValue = t; }
  }
  function walk(root, fn){
    if (!root) return;
    if (root.nodeType === 3) { fn(root); return; }
    if (root.nodeType !== 1 && root.nodeType !== 9 && root.nodeType !== 11) return;
    if (root.nodeType === 1 && SKIP[root.tagName]) return;
    var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), n;
    while ((n = w.nextNode())) fn(n);
  }
  function txAttrs(root){
    if (!root || (root.nodeType !== 1 && root.nodeType !== 9)) return;
    var els = root.nodeType === 9 ? [].slice.call(document.querySelectorAll('*')) : [root].concat([].slice.call(root.querySelectorAll('*')));
    for (var i = 0; i < els.length; i++) {
      var el = els[i];
      if (SKIP[el.tagName]) continue;
      var attrs = ['placeholder', 'title', 'aria-label'];
      for (var a = 0; a < attrs.length; a++) {
        var v = el.getAttribute(attrs[a]);
        if (v && CJK.test(v)) { var t = tr(v); if (t !== v) el.setAttribute(attrs[a], t); }
      }

  }
  function pass(root){ if (window.WM_LANG !== 'en') return; walk(root, txNode); txAttrs(root); }

  var READY = false;
  function boot(){
    if (window.WM_LANG === 'en') {
      document.title = 'Nameless Blade · Three Kingdoms';
      document.documentElement.lang = 'en';
      document.body.classList.add('wm-en');

      if (m) m.setAttribute('content', 'Nameless Blade — a hardcore turn-based roguelike set in 184 AD China. One blade, one body that can die.');
    }
    READY = true;
    pass(document);
    var mo = new MutationObserver(function(muts){
      if (window.WM_LANG !== 'en') return;
      for (var i = 0; i < muts.length; i++) {
        var mu = muts[i];
        if (mu.type === 'characterData') txNode(mu.target);

      }
    });
    mo.observe(document.body, { subtree: true, childList: true, characterData: true });

    var btn = document.createElement('div');
    btn.id = 'wm-lang-btn';
    btn.textContent = (window.WM_LANG === 'en' ? '中文' : 'EN');
    btn.style.cssText = 'position:fixed;right:14px;bottom:12px;z-index:9999;cursor:pointer;' +
      'font:600 12px/1 "SF Mono",Menlo,monospace;letter-spacing:1px;color:#c8963e;' +
      'background:rgba(18,16,12,.92);border:1px solid #3a3023;padding:7px 10px;border-radius:3px;' +
      'box-shadow:0 6px 18px rgba(0,0,0,.6);user-select:none';
    btn.onclick = function(){
      var next = window.WM_LANG === 'en' ? 'zh' : 'en';

  }

  /* ---- canvas text ---- */
  var P = CanvasRenderingContext2D.prototype;
  ['fillText', 'strokeText'].forEach(function(k){
    var f = P[k];

  });

  P.measureText = function(s){ return mt.call(this, tr(s)); };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
  window.addEventListener('load', function(){ pass(document); });
})();

/* ===== 地图生成 ===== */
function rectOverlap(a,b,p){
  return !(a.x+a.w+p<=b.x || b.x+b.w+p<=a.x || a.y+a.h+p<=b.y || b.y+b.h+p<=a.y);
}

function carveWide(tiles, x, y, w, h){
  for(let yy=y; yy<y+h; yy++) for(let xx=x; xx<x+w; xx++)
    if(yy>=0&&yy<GH&&xx>=0&&xx<GW) tiles[yy][xx]=0;
}

function corridorH(tiles, x1, x2, y){
  for(let x=Math.min(x1,x2); x<=Math.max(x1,x2); x++){
    tiles[y][x]=0; if(y+1<GH) tiles[y+1][x]=0;
  }
}
function corridorV(tiles, y1, y2, x){
  for(let y=Math.min(y1,y2); y<=Math.max(y1,y2); y++){
    tiles[y][x]=0; if(x+1<GW) tiles[y][x+1]=0;
  }
}

function tilePass(t){ return t!==1 && t!==6 && t!==T_BARREL && t!==T_ROCK; }

function reachSet(tiles, sx, sy){
  const seen = new Set([sy*GW+sx]);
  const q = [[sx,sy]];
  while(q.length){
    const [x,y] = q.shift();
    for(const [dx,dy] of R4){
      const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=GW||ny>=GH) continue;
      if(!tilePass(tiles[ny][nx])) continue;
      const k = ny*GW+nx;
      if(seen.has(k)) continue;
      seen.add(k); q.push([nx,ny]);
    }
  }
  return seen;
}

/* 生成后必检：出口、粮堆、任务物全都要走得过去 */
function ensureReachable(map){
  const {tiles, entry, exit} = map;
  // 出生点绝不能落在墙里
  if(!tilePass(tiles[entry.y][entry.x])) tiles[entry.y][entry.x]=0;
  if(!tilePass(tiles[exit.y][exit.x])) tiles[exit.y][exit.x]=5;
  let openNeighbour=false;
  for(const [dx,dy] of R4){
    const nx=entry.x+dx, ny=entry.y+dy;
    if(nx>=0&&ny>=0&&nx<GW&&ny<GH&&tilePass(tiles[ny][nx])) openNeighbour=true;
  }
  if(!openNeighbour){
    for(const [dx,dy] of R4){
      const nx=entry.x+dx, ny=entry.y+dy;
      if(nx>=0&&ny>=0&&nx<GW&&ny<GH) tiles[ny][nx]=0;
    }
  }
  const targets = [{x:exit.x,y:exit.y}]
    .concat((map.props||[]).map(p=>({x:p.x,y:p.y})))
    .concat((map.items||[]).map(i=>({x:i.x,y:i.y})))
    .concat((map.mobs||[]).filter(m=>m.boss).map(m=>({x:m.x,y:m.y})));
  for(const t of targets){
    const seen = reachSet(tiles, entry.x, entry.y);
    if(seen.has(t.y*GW+t.x)) continue;
    let bx=null, by=null, bd=1e9;
    seen.forEach(k=>{
      const x=k%GW, y=Math.floor(k/GW);
      const d=Math.abs(x-t.x)+Math.abs(y-t.y);
      if(d<bd){ bd=d; bx=x; by=y; }
    });
    if(bx===null) continue;
    let x=bx, y=by;
    while(x!==t.x){ x+=Math.sign(t.x-x); if(!tilePass(tiles[y][x])) tiles[y][x]=0; }
    while(y!==t.y){ y+=Math.sign(t.y-y); if(!tilePass(tiles[y][x])) tiles[y][x]=0; }
    if(!tilePass(tiles[t.y][t.x])) tiles[t.y][t.x]=0;
  }
  // 出口周围不许有人堵门
  (map.mobs||[]).forEach(m=>{
    if(dist(m.x,m.y,exit.x,exit.y) <= 1){
      for(let k=0;k<200;k++){
        const nx=1+rand(GW-2), ny=1+rand(GH-2);
        if(tiles[ny][nx]===0 && !map.mobs.some(o=>o.x===nx&&o.y===ny) && dist(nx,ny,entry.x,entry.y)>6){
          m.x=nx; m.y=ny; break;
        }
      }
    }
  });
  return map;
}

/* ===== 主题地图 ===== */
function blankMap(v){ return Array.from({length:GH},()=>Array(GW).fill(v===undefined?1:v)); }
function carve(t,x,y,w,h,v){
  for(let yy=y; yy<y+h; yy++) for(let xx=x; xx<x+w; xx++)
    if(xx>0&&yy>0&&xx<GW-1&&yy<GH-1) t[yy][xx] = (v===undefined?0:v);
}
function boxw(t,x,y,w,h){ carve(t,x,y,w,h,1); carve(t,x+1,y+1,w-2,h-2,0); }

function spawnEnemiesFor(cfg,o){
  const pool = cfg.mobs || [['levy',6]];
  const total = pool.reduce((s,m)=>s+m[1],0);
  const rs = o.rooms.filter(r=>r!==o.rooms[0]);
  if(!rs.length) return;
  let placed=0, ri=0, guard=0;
  while(placed<total && guard<600){
    guard++;
    const r = rs[ri % rs.length]; ri++;
    let acc=0, type='levy';
    for(const [tp,cn] of pool){ acc+=cn; if(placed<acc){ type=tp; break; } }
    let x,y,ok=false;
    for(let t=0;t<50;t++){
      x=r.x+rand(r.w); y=r.y+rand(r.h);
      if(o.tiles[y][x]===0 && dist(x,y,o.entry.x,o.entry.y)>5 && !o.mobs.some(m=>m.x===x&&m.y===y)){ ok=true; break; }
    }
    if(ok){
      const mob = mkMob(type,x,y);
      mob.patrol = [{x:r.cx,y:r.cy}, {x:r.x+1,y:r.y+1}, {x:r.x+r.w-2,y:r.y+r.h-2}];
      mob.pi = rand(3);
      o.mobs.push(mob); placed++;
    }
    else if(ri>rs.length*8) break;
  }
}

function spawnRelFor(cfg,o){
  function put(pool, list, rel){
    if(!pool||!pool.length||!list.length) return;
    const n = pool.reduce((a,m)=>a+m[1],0);
    let placed=0, g=0;
    while(placed<n && g<200){
      g++;
      const r=list[placed%list.length];
      let type='levy', acc=0;
      for(const [tp,cn] of pool){ acc+=cn; if(placed<acc){ type=tp; break; } }
      let x,y,ok=false;
      for(let t=0;t<50;t++){
        x=r.x+rand(r.w); y=r.y+rand(r.h);
        if(o.tiles[y][x]===0 && !(x===o.entry.x&&y===o.entry.y) && !o.mobs.some(m=>m.x===x&&m.y===y)){ ok=true; break; }
      }
      if(ok){
        const m0 = mkMob(type,x,y,{rel});
        if(rel==='ally' && cfg.allyNames && placed < cfg.allyNames.length){ m0.name = cfg.allyNames[placed]; m0.named = true; }
        o.mobs.push(m0); placed++;
      }
      else g+=2;
    }
  }
  put(cfg.allies, [o.rooms[0], o.rooms[1]||o.rooms[0]], 'ally');
  put(cfg.neutrals, [o.mid], 'neutral');
}

function placeObjective(cfg,o){
  if(!cfg.obj) return;
  if(cfg.obj.type==='burn'){
    [o.far, o.mid].forEach(r=>{
      for(let k=0;k<2;k++){
        let x,y,ok=false;
        for(let t=0;t<40;t++){
          x=r.x+1+rand(Math.max(1,r.w-2)); y=r.y+1+rand(Math.max(1,r.h-2));
          if(o.tiles[y][x]===0){ok=true;break;}
        }
        if(ok){ o.props.push({x,y,hp:100,max:100,kind:'grain',burning:0}); }
      }
    });
  }
  if(cfg.obj.type==='protect'){
    for(let k=0;k<3;k++){
      let x,y,ok=false;
      for(let t=0;t<40;t++){
        x=o.mid.cx+rand(3)-1; y=o.mid.cy+rand(3)-1;
        if(o.tiles[y] && o.tiles[y][x]===0){ok=true;break;}
      }
      if(ok) o.props.push({x,y,hp:100,max:100,kind:'grain',burning:0});
    }
  }
  if(cfg.obj.type==='steal'){
    let x,y,ok=false;
    for(let t=0;t<40;t++){
      x=o.far.x+1+rand(Math.max(1,o.far.w-2)); y=o.far.y+1+rand(Math.max(1,o.far.h-2));
      if(o.tiles[y][x]===0){ok=true;break;}
    }
    if(ok) o.items.push({x,y,taken:false,name:cfg.obj.item||'物'});
  }
  if(cfg.obj.type==='escort'){
    o.items.push({x:o.mid.cx,y:o.mid.cy,taken:false,name:'人',isEscort:true,hp:30,maxhp:30,dead:false});
  }
}

function spawnBossFor(cfg,o){
  if(!cfg.boss) return;
  const r = o.far || o.rooms[0];
  let x=r.cx, y=r.cy;
  for(let t=0;t<50;t++){
    const nx=r.x+rand(r.w), ny=r.y+rand(r.h);
    if(o.tiles[ny] && o.tiles[ny][nx]===0 && !o.mobs.some(m=>m.x===nx&&m.y===ny)){ x=nx; y=ny; break; }
  }
  o.mobs.push(mkMob(cfg.boss, x, y));
}
function finishTheme(cfg,o){
  placeObjective(cfg,o);
  spawnBossFor(cfg,o);
  spawnEnemiesFor(cfg,o);
  spawnRelFor(cfg,o);
  return ensureReachable(o);
}

/* ---- 军营：营帐、粮堆、瞭望塔、营门、火盆 ---- */
function themeCamp(cfg){
  const tiles = blankMap(1);
  carve(tiles, 2, 2, 50, 35);                 // 营区地面
  const rooms=[];
  for(let ry=0; ry<3; ry++) for(let rx=0; rx<3; rx++){
    rooms.push({x:3+rx*16, y:3+ry*11, w:14, h:9, cx:3+rx*16+7, cy:3+ry*11+4});
  }
  // 营道
  for(let y=12;y<=13;y++) carve(tiles,2,y,50,1);
  for(let y=23;y<=24;y++) carve(tiles,2,y,50,1);
  for(let x=18;x<=19;x++) carve(tiles,x,2,1,35);
  for(let x=35;x<=36;x++) carve(tiles,x,2,1,35);
  // 营帐（帐幕墙块，帐口朝营道）
  rooms.forEach(r=>{
    for(let k=0;k<4;k++){
      const x=r.x+1+rand(Math.max(1,r.w-8)), y=r.y+1+rand(Math.max(1,r.h-6));
      boxw(tiles,x,y,5,4);
    }
  });
  // 营门两侧的帐
  boxw(tiles,21,29,5,4); boxw(tiles,30,29,5,4);
  // 瞭望塔：高地
  [[4,4],[48,4],[4,33],[48,33]].forEach(([x,y])=>carve(tiles,x,y,2,2,T_HIGH));
  // 火盆
  for(let i=0;i<8;i++){
    const x=3+rand(47), y=3+rand(33);
    if(tiles[y][x]===0 && !rooms.some(r=>false)) tiles[y][x]=T_BRAZI;
  }
  // 营门
  tiles[35][27]=T_DOOR; tiles[35][28]=T_DOOR;
  const entry={x:27,y:34}, exit={x:27,y:3};
  tiles[exit.y][exit.x]=5;
  return finishTheme(cfg,{tiles,rooms,props:[],items:[],mobs:[],entry,exit,
    far:rooms[8]||rooms[0], mid:rooms[4]||rooms[0]});
}

/* ---- 城镇：街道、民居、院墙、城门、巷战 ---- */
function themeTown(cfg){
  if(cfg.mood==='palace') return themePalace(cfg);
  const tiles = blankMap(1);
  carve(tiles, 2, 2, 50, 35);
  // 街道
  for(const y of [10,11,22,23]) carve(tiles,2,y,50,1);
  for(const x of [12,13,31,32]) carve(tiles,x,2,1,35);
  // 民居
  const rooms=[];
  const blocks=[[3,3,9,6],[15,3,15,6],[34,3,15,6],[3,13,9,8],[15,13,15,8],[34,13,15,8],
                [3,25,9,10],[15,25,15,10],[34,25,15,10]];
  blocks.forEach(([x,y,w,h],i)=>{
    boxw(tiles,x,y,w,h);
    tiles[y+h-1][x+Math.floor(w/2)]=T_DOOR;
    rooms.push({x,y,w,h,cx:x+Math.floor(w/2),cy:y+Math.floor(h/2)});
  });
  // 巷口木桶
  for(let i=0;i<6;i++){
    const x=3+rand(47), y=3+rand(33);
    if(tiles[y][x]===0) tiles[y][x]=T_BARREL;
  }
  tiles[35][27]=T_DOOR;
  // 街上有百姓。他们不帮你，也不会拦你——除非你先动手
  cfg.neutrals = (cfg.neutrals||[]).concat([['levy',2]]);
  const entry={x:27,y:34}, exit={x:27,y:3};
  tiles[exit.y][exit.x]=5;
  return finishTheme(cfg,{tiles,rooms,props:[],items:[],mobs:[],entry,exit,
    far:rooms[2]||rooms[0], mid:rooms[4]||rooms[0]});
}

/* ---- 皇宫：宫殿、长廊、内院、禁地 ---- */
function themePalace(cfg){
  const tiles = blankMap(1);
  carve(tiles, 2, 2, 50, 35);
  for(const y of [18,19,20]) carve(tiles,2,y,50,1);      // 横长廊
  for(const x of [26,27,28]) carve(tiles,x,2,1,35);      // 纵长廊
  const rooms=[];
  // 三座殿
  [[5,4,17,11],[32,4,17,11],[5,24,17,11]].forEach(([x,y,w,h])=>{
    boxw(tiles,x,y,w,h);
    tiles[y+h-1][x+Math.floor(w/2)]=T_DOOR;
    rooms.push({x,y,w,h,cx:x+Math.floor(w/2),cy:y+Math.floor(h/2)});
  });
  // 禁地（小内院）
  boxw(tiles,33,24,15,10);
  tiles[33][40]=T_DOOR;
  rooms.push({x:33,y:24,w:15,h:10,cx:40,cy:29});
  // 宫门
  tiles[35][26]=T_DOOR; tiles[35][27]=T_DOOR; tiles[35][28]=T_DOOR;
  const entry={x:27,y:34}, exit={x:27,y:3};
  tiles[exit.y][exit.x]=5;
  return finishTheme(cfg,{tiles,rooms,props:[],items:[],mobs:[],entry,exit,
    far:rooms[1]||rooms[0], mid:rooms[3]||rooms[0]});
}

/* ---- 山道：窄道、岩石、高地、隘口、伏击 ---- */
function themeMountain(cfg){
  const tiles = blankMap(1);
  const rooms=[];
  let x=27;
  for(let y=34; y>=3; y--){
    if(y%7===0) x += (Math.random()<0.5?-4:4);
    x = clamp(x, 6, 46);
    const w = (y>18 && y<22) ? 1 : 2+rand(2);      // 隘口收窄
    carve(tiles, x, y, w, 1);
    if(y%5===0) rooms.push({x:x-2,y:y-1,w:w+4,h:3,cx:x,cy:y});
  }
  // 猎户下的套索、绊马坑
  for(let i=0;i<6;i++){
    const rx=6+rand(42), ry=6+rand(28);
    if(tiles[ry][rx]===0) tiles[ry][rx]=T_TRAP;
  }
  // 岩石与高地
  for(let i=0;i<60;i++){
    const rx=3+rand(48), ry=3+rand(34);
    if(tiles[ry][rx]===1) continue;
    tiles[ry][rx] = Math.random()<0.7 ? T_ROCK : T_HIGH;
  }
  const entry={x:27,y:34}, exit={x:27,y:3};
  carve(tiles, exit.x-1, 3, 3, 1);
  tiles[exit.y][exit.x]=5;
  if(!rooms.length) rooms.push({x:20,y:20,w:10,h:10,cx:25,cy:25});
  return finishTheme(cfg,{tiles,rooms,props:[],items:[],mobs:[],entry,exit,
    far:rooms[rooms.length-1], mid:rooms[Math.floor(rooms.length/2)]});
}

/* ---- 渡口：河流、浅滩、木桥、水战 ---- */
function themeFord(cfg){
  const tiles = blankMap(0);
  for(let y=0;y<GH;y++) for(let x=0;x<GW;x++){
    if(x<2||y<2||x>=GW-2||y>=GH-2) tiles[y][x]=1;
  }
  const river=21+rand(4);
  for(let y=2;y<GH-2;y++) for(let x=river;x<river+6;x++) tiles[y][x]=2;
  // 浅滩两段
  for(let y=6;y<10;y++) for(let x=river;x<river+6;x++) tiles[y][x]=T_SHALLOW;
  for(let y=28;y<32;y++) for(let x=river;x<river+6;x++) tiles[y][x]=T_SHALLOW;
  // 木桥
  const bridges=[14, 22];
  bridges.forEach(by=>{ for(let y=by;y<by+2;y++) for(let x=river;x<river+6;x++) tiles[y][x]=0; });
  // 岸上掩体
  for(let i=0;i<40;i++){
    const x=(Math.random()<0.5)? 4+rand(15) : river+8+rand(15);
    const y=3+rand(34);
    if(tiles[y][x]===0 && Math.random()<0.5) tiles[y][x]=3;
  }
  // 岸边两条船，划过去比踩水快
  for(const by of [17,26]){
    for(let k=0;k<2;k++){
      const bx=river+1+k*2;
      if(tiles[by][bx]===2) tiles[by][bx]=T_BOAT;
    }
  }
  const rooms=[
    {x:4,y:4,w:14,h:32,cx:11,cy:20},
    {x:river+9,y:4,w:14,h:32,cx:river+16,cy:20}
  ];
  const entry={x:11,y:33}, exit={x:river+16,y:4};
  tiles[exit.y][exit.x]=5;
  return finishTheme(cfg,{tiles,rooms,props:[],items:[],mobs:[],entry,exit,
    far:rooms[1], mid:rooms[0]});
}

/* ---- 粮仓：仓房、粮车、隔离带、可燃密集 ---- */
function themeGranary(cfg){
  const tiles = blankMap(1);
  carve(tiles, 2, 2, 50, 35);
  const rooms=[];
  [[4,4,15,11],[24,4,15,11],[4,22,15,11],[24,22,15,11]].forEach(([x,y,w,h])=>{
    boxw(tiles,x,y,w,h);
    tiles[y+h-1][x+w/2]=T_DOOR;
    rooms.push({x,y,w,h,cx:x+Math.floor(w/2),cy:y+Math.floor(h/2)});
  });
  // 隔离带：仓间空地（保持空）
  const props=[];
  for(let i=0;i<16;i++){
    const r=rooms[rand(rooms.length)];
    const x=r.x+1+rand(Math.max(1,r.w-2)), y=r.y+1+rand(Math.max(1,r.h-2));
    if(tiles[y][x]===0 && !props.some(q=>q.x===x&&q.y===y)) props.push({x,y,hp:100,max:100,kind:'grain',burning:0});
  }
  // 木桶（易燃）
  for(let i=0;i<8;i++){
    const x=3+rand(47), y=3+rand(33);
    if(tiles[y][x]===0) tiles[y][x]=T_BARREL;
  }
  const entry={x:27,y:34}, exit={x:27,y:3};
  tiles[exit.y][exit.x]=5;
  return finishTheme(cfg,{tiles,rooms,props,items:[],mobs:[],entry,exit,
    far:rooms[1], mid:rooms[2]});
}

const THEMES = {camp:themeCamp, town:themeTown, palace:themePalace,
                mountain:themeMountain, ford:themeFord, granary:themeGranary};
THEMES.road = themeMountain;
THEMES.pass = themeMountain;
THEMES.granary = themeGranary;

function genMap(cfg){
  if(THEMES[cfg.theme]) return THEMES[cfg.theme](cfg);
  const tiles = Array.from({length:GH},()=>Array(GW).fill(1));
  const rooms = [];
  const want = (cfg.rooms || 8) + 6;
  let tries=0;
  while(rooms.length<want && tries<400){
    tries++;
    const w=4+rand(6), h=3+rand(5);
    const x=2+rand(GW-w-4), y=2+rand(GH-h-4);
    const r={x,y,w,h,cx:x+Math.floor(w/2), cy:y+Math.floor(h/2)};
    if(rooms.some(o=>rectOverlap(r,o,1))) continue;
    rooms.push(r);
  }
  rooms.forEach(r=>carveWide(tiles,r.x,r.y,r.w,r.h));
  const sorted=[...rooms].sort((a,b)=>a.cx-b.cx);
  for(let i=1;i<sorted.length;i++){
    const a=sorted[i-1], b=sorted[i];
    corridorH(tiles,a.cx,b.cx,a.cy);
    corridorV(tiles,a.cy,b.cy,b.cx);
  }

  const props=[], items=[];
  const mobs=[];

  // 主题装饰
  function deco(r){
    for(let i=0;i<3;i++){
      const x=r.x+rand(r.w), y=r.y+rand(r.h);
      if(tiles[y][x]===0 && Math.random()<0.5) tiles[y][x]=3;
    }
    if(Math.random()<0.4){
      const x=r.x+rand(r.w), y=r.y+rand(r.h);
      if(tiles[y][x]===0) tiles[y][x]=6;
    }
  }
  const far = sorted[sorted.length-1];
  const near = sorted[0];

  rooms.forEach((r,i)=>{
    if(cfg.theme==='ford' && r.cy>8 && r.cy<GH-8 && r.w>4){
      for(let yy=r.y+1; yy<r.y+r.h-1; yy++) for(let xx=r.cx-1; xx<=r.cx+1; xx++) tiles[yy][xx]=2;
    } else deco(r);
    if(cfg.theme==='town' && i%2===0){
      // 屋里加一道墙，做出街巷
      const wx=r.cx, wy=r.y+1;
      for(let yy=r.y; yy<r.y+r.h; yy++) if(tiles[yy][wx]===0 && Math.random()<0.6) tiles[yy][wx]=1;
    }
  });

  // 入口 / 出口
  const entry={x:near.cx, y:near.cy};
  const exit={x:far.cx, y:far.cy};
  tiles[exit.y][exit.x]=5;

  // 可燃物
  const burnRooms = cfg.obj && cfg.obj.type==='burn' ? [far, sorted[sorted.length-2]||far] : [];
  burnRooms.forEach(r=>{
    for(let k=0;k<2;k++){
      let x,y,ok=false;
      for(let t=0;t<30;t++){
        x=r.x+1+rand(Math.max(1,r.w-2)); y=r.y+1+rand(Math.max(1,r.h-2));
        if(tiles[y][x]===0){ok=true;break;}
      }
      if(ok){ tiles[y][x]=4; props.push({x,y,hp:100,max:100,kind:'grain',burning:0}); }
    }
  });
  // 保护类：粮堆在中间房间
  if(cfg.obj && cfg.obj.type==='protect'){
    const mid = sorted[Math.floor(sorted.length/2)] || far;
    for(let k=0;k<3;k++){
      let x,y,ok=false;
      for(let t=0;t<40;t++){
        x=mid.x+1+rand(Math.max(1,mid.w-2)); y=mid.y+1+rand(Math.max(1,mid.h-2));
        if(tiles[y][x]===0){ok=true;break;}
      }
      if(ok){ tiles[y][x]=4; props.push({x,y,hp:100,max:100,kind:'grain',burning:0}); }
    }
  }
  // 取物：放在最远房间
  if(cfg.obj && cfg.obj.type==='steal'){
    let x,y,ok=false;
    for(let t=0;t<40;t++){
      x=far.x+1+rand(Math.max(1,far.w-2)); y=far.y+1+rand(Math.max(1,far.h-2));
      if(tiles[y][x]===0){ok=true;break;}
    }
    if(ok) items.push({x,y,taken:false,name:cfg.obj.item||'物'});
  }
  // 护送：目标在中间，终点是出口
  if(cfg.obj && cfg.obj.type==='escort'){
    const mid=sorted[Math.floor(sorted.length/2)]||far;
    items.push({x:mid.cx,y:mid.cy,taken:false,name:'人',isEscort:true,hp:30,maxhp:30,dead:false});
  }

  // 敌人：严格按配置总数，均匀铺到非入口房间
  const moodPool = cfg.mobs || [['levy',6]];
  const total = moodPool.reduce((s,m)=>s+m[1],0);
  const spawnRooms = rooms.filter(r=>r!==near);
  let placed = 0, ri = 0, guardN = 0;
  while(placed < total && spawnRooms.length && guardN < 600){
    guardN++;
    const r = spawnRooms[ri % spawnRooms.length]; ri++;
    let acc = 0, type = 'levy';
    for(const [tp,cn] of moodPool){ acc += cn; if(placed < acc){ type = tp; break; } }
    let x,y,ok=false;
    for(let t=0;t<50;t++){
      x=r.x+rand(r.w); y=r.y+rand(r.h);
      if(tiles[y][x]===0 && dist(x,y,entry.x,entry.y)>6 && !mobs.some(m=>m.x===x&&m.y===y)){ok=true;break;}
    }
    if(ok){ mobs.push(mkMob(type,x,y)); placed++; }
    else if(ri > spawnRooms.length*6) break;
  }

  // 友军 / 中立：敌我关系得真能看见，不然绿黄红只是一句口号
  function spawnRel(pool, roomList, rel){
    if(!pool || !pool.length || !roomList.length) return;
    const n = pool.reduce((a,m)=>a+m[1],0);
    let placed = 0, g = 0;
    while(placed < n && g < 240){
      g++;
      const r = roomList[placed % roomList.length];
      let type='levy', a=0;
      for(const [tp,cn] of pool){ a += cn; if(placed < a){ type=tp; break; } }
      let x,y,ok=false;
      for(let t=0;t<50;t++){
        x=r.x+rand(r.w); y=r.y+rand(r.h);
        if(tiles[y][x]===0 && !(x===entry.x&&y===entry.y) && !mobs.some(m=>m.x===x&&m.y===y)){ ok=true; break; }
      }
      if(ok){ mobs.push(mkMob(type,x,y,{rel})); placed++; }
      else g += 2;
    }
  }
  if(cfg.allies)   spawnRel(cfg.allies,   [near, sorted[1]||near], 'ally');
  if(cfg.neutrals) spawnRel(cfg.neutrals, [sorted[Math.floor(sorted.length/2)]||near], 'neutral');

  return ensureReachable({tiles, rooms, props, items, mobs, entry, exit, cfg});
}

function mkMob(type,x,y,extra){
  const base = MOBS[type] || MOBS.levy;
  return Object.assign({
    type, x, y, hp:base.hp, max:base.hp,
    atk:base.atk, def:base.def, ai:base.ai, range:base.range,
    color:base.color, name:base.name, cd:0, bleed:0, bleedT:0,
    lv:base.lv, kind:base.kind, qi:base.qi, maxQi:base.qi,
    weapon:base.weapon, armor:base.armor, spd:base.spd,
    acc:base.acc, eva:base.eva, res:base.res,
    rel:'hostile', seen:false, alert:false, dead:false, boss:base.boss
  }, extra||{});
}

/* 一件东西到底值多少 —— 面板里要把数写出来 */
const RARITY = {
  common:{name:'普通', c:'#9a9186', m:1.0,  af:0},
  fine:  {name:'精良', c:'#7fa86a', m:1.12, af:1},
  rare:  {name:'稀有', c:'#6a92c8', m:1.25, af:2},
  epic:  {name:'史诗', c:'#a274c8', m:1.4,  af:3},
  legend:{name:'传奇', c:'#d8a048', m:1.6,  af:4}
};

const AFFIX = {
  sharp:     {n:'锋利', d:'攻击 +3', atk:3},
  blood:     {n:'嗜血', d:'击杀回气血 6', killHeal:6},
  pierce:    {n:'破甲', d:'无视三成防御', ignoreDef:0.3},
  swift:     {n:'迅捷', d:'命中后三成概率减一回合冷却', cdCut:1},
  heavy:     {n:'沉重', d:'伤害 +25%，每步多耗 1 体力', dmgMul:1.25, moveCost:1},
  armorPierce:{n:'贯甲', d:'无视一半防御', ignoreDef:0.5},
  guard:     {n:'守势', d:'格挡后下一击 +40%', guardBoost:0.4},
  cloud:     {n:'穿云', d:'攻击距离 +1', range:1},
  wind:      {n:'追风', d:'连续出手每击 +8% 伤害', comboDmg:0.08},
  flame:     {n:'烈焰', d:'命中后目标燃烧 6，两回合', burn:6}
};
const AFFIX_WEAPON = ['sharp','pierce','swift','heavy','armorPierce','cloud','wind','flame','blood'];
const AFFIX_ARMOR  = ['blood','guard','sharp','pierce'];

function iid(x){ return (x && typeof x==='object') ? x.id : x; }
function asGear(x){
  if(!x) return null;
  if(typeof x==='string') return {id:x, r:'common', af:[]};
  return x;
}

/* 一件器物的真实合值：底子 × 稀有度 + 词缀 */
function instStats(x){
  const inst = asGear(x);
  if(!inst) return null;
  const base = ITEMS[inst.id] || {};
  const rr = RARITY[inst.r] || RARITY.common;
  const o = {atk:base.atk||0, def:base.def||0, eva:base.eva||0, hp:base.hp||0, range:base.range||0,
             ignoreDef:0, cdCut:0, killHeal:0, dmgMul:1, moveCost:0, burn:0, comboDmg:0, guardBoost:0};
  if(o.atk) o.atk = Math.round(o.atk * rr.m);
  if(o.def) o.def = Math.round(o.def * rr.m);
  (inst.af||[]).forEach(k=>{
    const a = AFFIX[k]; if(!a) return;
    o.atk += a.atk||0; o.def += a.def||0; o.eva += a.eva||0; o.hp += a.hp||0; o.range += a.range||0;
    o.ignoreDef = Math.max(o.ignoreDef, a.ignoreDef||0);
    o.cdCut += a.cdCut||0; o.killHeal += a.killHeal||0;
    o.dmgMul *= (a.dmgMul||1); o.moveCost += a.moveCost||0; o.burn += a.burn||0;
    o.comboDmg += a.comboDmg||0; o.guardBoost += a.guardBoost||0;
  });
  return o;
}

function mkGear(id, r, af){ return {id, r:r||'common', af:af||[]}; }

function rollAffixes(pool, n){
  const out = [];
  for(let i=0;i<n;i++){
    const cand = pool.filter(x=>!out.includes(x));
    if(!cand.length) break;
    out.push(pick(cand));
  }
  return out;
}

/* 敌人身上翻出来的东西：等级越高越可能出好东西 */
function gearFor(id, lv){
  const base = ITEMS[id];
  const roll = Math.random();
  let r = 'common';
  if(lv>=4 && roll>0.955) r = 'legend';
  else if(lv>=3 && roll>0.87) r = 'epic';
  else if(roll>0.70) r = 'rare';
  else if(roll>0.42) r = 'fine';
  const pool = (base && base.type==='armor') ? AFFIX_ARMOR : AFFIX_WEAPON;
  return mkGear(id, r, rollAffixes(pool, RARITY[r].af));
}

function gearLabel(inst){
  if(!inst) return '徒手';
  const nm = (ITEMS[inst.id]||{}).name || '?';
  const rr = RARITY[inst.r] || RARITY.common;
  return `<span style="color:${rr.c}">${nm}·${rr.name}</span>`;
}

function itemStat(it){
  if(!it) return '';
  const isInst = (typeof it==='object' && it.id && ITEMS[it.id]);
  const o = isInst ? instStats(it) : it;
  const out = [];
  if(o.atk)   out.push('攻击 +'+o.atk);
  if(o.def)   out.push('防御 +'+o.def);
  if(o.eva)   out.push('闪避 '+(o.eva>0?'+':'')+o.eva);
  if(o.hp)    out.push('气血上限 +'+o.hp);
  if(o.heal)  out.push('立刻回气血 +'+o.heal);
  if(o.qi)    out.push((run&&run.resName?run.resName:'斗气')+' +'+o.qi);
  if(o.sta)   out.push('体力 +'+o.sta);
  if(o.range) out.push('攻击距离 +'+o.range);
  if(isInst){
    if(o.ignoreDef) out.push('无视防御 '+Math.round(o.ignoreDef*100)+'%');
    if(o.dmgMul>1)  out.push('伤害 +'+Math.round((o.dmgMul-1)*100)+'%');
    if(o.killHeal)  out.push('击杀回血 +'+o.killHeal);
    if(o.cdCut)     out.push('命中减冷却');
    if(o.burn)      out.push('附加燃烧 '+o.burn);
    if(o.comboDmg)  out.push('连击加伤');
    if(o.guardBoost) out.push('格挡后加伤');
    if(o.moveCost)  out.push('每步多耗 '+o.moveCost+' 体力');
  }
  return out.join('，');
}

function itemById(id){ return ITEMS[id] || null; }
function it_desc(it){ return it ? it.d : ''; }

/* ===== 视野 ===== */
function lineOfSight(x0,y0,x1,y1,tiles){
  let dx=Math.abs(x1-x0), dy=Math.abs(y1-y0);
  let sx=x0<x1?1:-1, sy=y0<y1?1:-1;
  let err=dx-dy, x=x0, y=y0;
  while(true){
    if(x===x1 && y===y1) return true;
    if(!(x===x0&&y===y0)){
      const t=tiles[y][x];
      if(t===1||t===6||t===T_ROCK||t===T_DOOR||t===T_BARREL) return false;
    }
    const e2=2*err;
    if(e2>-dy){ err-=dy; x+=sx; }
    if(e2<dx){ err+=dx; y+=sy; }
    if(Math.abs(x-x0)>60) return false;
  }
}

/* 烟挡视线：线段只要穿过烟区，就看不清 */
function smokeBetween(x0,y0,x1,y1){
  if(!G || !G.smoke) return false;
  const sm = G.smoke;
  const steps = Math.max(Math.abs(x1-x0), Math.abs(y1-y0)) * 2;
  for(let i=1;i<=steps;i++){
    const t = i/steps;
    const x = Math.round(x0 + (x1-x0)*t);
    const y = Math.round(y0 + (y1-y0)*t);
    if(dist(x,y,sm.x,sm.y) <= (sm.r||1)) return true;
  }
  return false;
}

/* 敌人能不能看见玩家：距离、视线、烟，三者都算 */
function canEnemySee(m){
  if(!G || !m || m.dead) return false;
  if(dist(m.x,m.y,G.px,G.py) > run.sight+2) return false;
  if(smokeBetween(m.x,m.y,G.px,G.py)) return false;
  return lineOfSight(m.x,m.y,G.px,G.py,G.tiles);
}

function computeFOV(){
  const {tiles} = G;
  for(let y=0;y<GH;y++) for(let x=0;x<GW;x++) G.visible[y][x]=false;
  const r = run.sight;
  for(let y=Math.max(0,G.py-r); y<=Math.min(GH-1,G.py+r); y++){
    for(let x=Math.max(0,G.px-r); x<=Math.min(GW-1,G.px+r); x++){
      if(dist(G.px,G.py,x,y)>r) continue;
      if(lineOfSight(G.px,G.py,x,y,tiles)){
        G.visible[y][x]=true; G.explored[y][x]=true;
      }
    }
  }
  if(G.mobs.some(m=>!m.dead && m.rel==='hostile' && canEnemySee(m))){
    G.lastSeen = {x:G.px, y:G.py};
  }
  // 敌人可见性
  G.mobs.forEach(m=>{
    m.visible = G.visible[m.y] && G.visible[m.y][m.x] && m.x>=0;
    if(m.visible && !m.seen){ m.seen=true; addLog(m.name+' 出现在视野里。', 'r'); }
  });
  // 火光照亮
  G.props.forEach(p=>{
    if(p.burning>0){
      for(let y=p.y-3;y<=p.y+3;y++) for(let x=p.x-3;x<=p.x+3;x++)
        if(x>=0&&x<GW&&y>=0&&y<GH&&dist(x,y,p.x,p.y)<=3){ G.visible[y][x]=true; G.explored[y][x]=true; }
    }
  });
}

                  ford:'河横在中间，浅滩踩水慢，桥上才好过。',
                  granary:'四座仓房围出空地，粮堆密，木桶一点就炸。'}[thKey] || '四野空旷。';

  if(cfg.note) addLog(cfg.note, 'r');
