  OV.querySelectorAll('[data-master]').forEach(el=>{
    el.onclick = ()=>{
      const parts = el.dataset.master.split('|');
      addMaster(parts[0], parts[1]);
    };
  });
}

function objText(o){
  if(!o) return '无';
  if(o.type==='burn')    return `烧掉 ${o.need} 处粮草（已烧 ${G.objDone||0}）`;
  if(o.type==='protect') return `守住 ${o.need} 堆粮（尚存 ${G.props?G.props.filter(p=>p.kind==='grain'&&p.burning===0).length:0}）`;
  if(o.type==='kill')    return `取 ${o.eliteName||'目标'} 的命`;
  if(o.type==='steal')   return `取走 ${o.item||'东西'}`;
  if(o.type==='escort')  return `把 ${o.who||'人'} 接出来`;
  if(o.type==='clear')   return `清空此地（余 ${G.mobs?G.mobs.filter(m=>!m.dead && m.rel==='hostile').length:0}）`;
  return '无';
}

function unequip(slot){
  const id = run.equip[slot];
  if(!id) return;
  run.items.push(id);
  if(run.items.length > MAXBAG){ addLog('背囊塞不下，先扔掉些东西。','r'); run.items.pop(); return; }
  run.equip[slot] = null;
  recalcGear();
  addLog('收了 '+(ITEMS[iid(id)]||{}).name+'。','');
  updateTopbar();
  if(G && !G.over){
    endTurn();
    renderPanel('char');
  }
}

function useItem(i){
  const raw = run.items[i];
  const id = iid(raw);
  const it = ITEMS[id];
  if(!it) return;

  if(it.type === 'use'){
    // 先看清有没有用，再决定扣不扣
    if(it.heal && run.hp >= run.maxhp){ addLog('气血正足，这药留着。','r'); renderPanel('bag'); return; }
    if(it.qi && run.res >= run.resMax){ addLog(run.resName+'已满，用不上。','r'); renderPanel('bag'); return; }
    if(it.sta && run.st >= run.stmax){ addLog('体力还撑得住。','r'); renderPanel('bag'); return; }

    if(id === 'oil'){
      let n=0;
      for(let y=G.py-2;y<=G.py+2;y++) for(let x=G.px-2;x<=G.px+2;x++){
        const p = propAt(x,y);
        if(p && p.kind==='grain' && p.burning<=0){ p.burning=1; n++; }
      }
      if(!n){ addLog('身边没有可烧的东西，油还留着。','r'); renderPanel('bag'); return; }
      addLog(`火油泼开，${n} 堆粮着了。`,'y');
      G.alarm = clamp(G.alarm+1,0,4);
    } else {
      if(it.heal) run.hp = clamp(run.hp+it.heal, 0, run.maxhp);
      if(it.qi)   run.res = clamp(run.res+it.qi, 0, run.resMax);
      if(it.sta)  run.st  = clamp(run.st+it.sta, 0, run.stmax);
      addLog('用了 '+it.name+'。','g');
    }
    run.items.splice(i,1);
  } else {
    const slot = it.type;
    const old = run.equip[slot];
    run.equip[slot] = (it.type==='weapon'||it.type==='armor') ? (raw||id) : id;
    run.items.splice(i,1);
    if(old) run.items.push(old);
    recalcGear();
    addLog('换上 '+it.name+'。','g');
  }

  updateTopbar();
  if(G && !G.over){
    endTurn();                 // 吃药换甲都要一个回合
    if(UI.paused) renderPanel(UI.panel || 'bag');
  }
}

/* 这件换上去，比身上的强多少 */
function equipDiff(inst){
  if(!inst) return '';
  const it = ITEMS[iid(inst)];
  if(!it || it.type==='use') return '';
  const cur = instStats(run.equip[it.type]);
  const nw = instStats(inst);
  if(!nw) return '';
  const parts = [];
  const keys = [['atk','攻'],['def','防'],['eva','闪'],['hp','血'],['range','程']];
  keys.forEach(([k,label])=>{
    const d = (nw[k]||0) - (cur ? (cur[k]||0) : 0);
    if(d) parts.push(`${label}${d>0?'+':''}${d}`);
  });
  return parts.join(' ') || '持平';
}

/* ===== 战利品三选一 ===== */
function rollReward(n){
  const out = [];
  const ids = ['dao','jian','armor2','changdao','med','pill','oil','food'];
  for(let i=0;i<(n||3);i++){
    const id = pick(ids);
    const it = ITEMS[id];
    if(it.type==='use') out.push({kind:'item', id});
    else out.push({kind:'gear', g: gearFor(id, 3 + rand(4))});
  }
  return out;
}

function showReward(){
  if(!run){ showCamp(); return; }
  const picks = rollReward(3);
  const cards = picks.map((p,i)=>{
    const it = ITEMS[p.kind==='item'?p.id:iid(p.g)];
    const nm = p.kind==='item' ? it.name : gearLabel(p.g);
    const st = p.kind==='item' ? itemStat(it) : itemStat(p.g);
    return `<div class="opt" data-pick="${i}">
      <div class="t">${nm}</div>
      <div class="d">${st||it.d}</div>
      <div class="m">${p.kind==='item'?'补给':'器物'}</div>
    </div>`;
  }).join('');
  ov(`<div class="tag">缴获</div><h2>从尸首与行囊里挑一件</h2>
    <p class="lead" style="font-size:12.5px">只能拿一件。背囊 ${run.items.length}/${MAXBAG}。</p>
    ${cards}
    <div class="opt" data-pick="skip"><div class="t">什么都不要</div><div class="d">轻装上路。</div></div>
  `);
  [...document.querySelectorAll('[data-pick]')].forEach(el=>{
    el.onclick = ()=>{
      const k = el.dataset.pick;
      if(k !== 'skip'){
        const p = picks[parseInt(k)];
        if(run.items.length >= MAXBAG) addLog('背囊满了，拿不了。','r');

      showCamp();
    };
  });
}

    <div class="opt" data-camp="none"><div class="t">不歇，连夜走</div><div class="d">什么都不换，警觉 -1。</div><div class="m">赶路</div></div>
  `);

    el.onclick = ()=>{
      const k = el.dataset.camp;
      if(k==='rest'){
        run.hp = clamp(run.hp + Math.round(run.maxhp*0.4), 0, run.maxhp);
        run.st = run.stmax;
      } else if(k==='heal'){
        run.hp = clamp(run.hp + Math.round(run.maxhp*0.7), 0, run.maxhp);
        W.alarm = clamp((W.alarm||0)+1, 0, 4);

      }
      hideOv();
      showEvent(W.evIdx+1);
    };
  });
}

function forgeWeapon(){
  const w = asGear(run.equip.weapon);
  if(!w){ addLog('赤手空拳，没得磨。','r'); return; }
  const pool = AFFIX_WEAPON.filter(k=>!(w.af||[]).includes(k));
  const rr = RARITY[w.r] || RARITY.common;
  if(!pool.length || (w.af||[]).length >= rr.af){
    addLog('这件器物已经吃满了词缀。','r');
    return;
  }
  w.af.push(pick(pool));
  recalcGear();
  addLog('磨出一条「'+AFFIX[w.af[w.af.length-1]].n+'」。','g');
}

function mch(id, p){
  const m = run && run.mastery ? run.mastery[id] : null;
  return (m && m.p===p) ? m.l : 0;
}
function brLv(id){ const m = run&&run.mastery?run.mastery[id]:null; return m?m.l:0; }

function syncCombos(){
  if(!run) return;
  run.ch = {};
  COMBOS.forEach(c=>{
    if(run.cls!==c.cls) return;
    if(brLv(c.a)>0 && brLv(c.b)>0) run.ch[c.flag] = 1;
  });
}

function addMaster(id, path){
  if(!run || run.sp<=0) return;
  run.mastery = run.mastery || {};
  const m = run.mastery[id] || (run.mastery[id] = {p:null, l:0});
  if(m.p && m.p!==path) return;
  if(m.l>=2) return;
  m.p = path; m.l++;
  run.sp--;
  syncCombos();
  addLog('「'+BRANCHES[id][path].n+'」又进一层。','g');
  renderPanel(UI.panel);
}

function addRank(id){
  if(!run || run.sp<=0) return;
  const rk = run.rank[id]||0;
  if(rk>=5) return;
  run.rank[id] = rk+1;
  run.sp--;
  addLog(SKILLS[id].name+' 精进一阶。','y');
  updateTopbar();
}

function showEvent(idx){

  const ev0 = EVENTS[idx];
  if(ev0.req && !ev0.req(W)){ showEvent(idx+1); return; }
  W.evIdx = idx;
  const ev = ev0;
  W.year = ev.y;
  const intro = typeof ev.intro==='function' ? ev.intro(W) : ev.intro;
  const pool = ev.choices.map((c,i)=>({c,i})).filter(o=>!o.c.req || o.c.req(W));
  const usable = pool.length ? pool : [{c:ev.choices[0], i:0}];
  const choices = usable.map(o=>{
    const c = o.c, i = o.i;
    return `
    <div class="opt" data-i="${i}">
      <div class="t">${c.t}</div>
      <div class="d">${c.d}</div>
      <div class="m">${taskMeta(c.task)}</div>
    </div>`;
  }).join('');
  ov(`
    <div class="tag">${ev.y} 年 ${ev.m} 月</div>
    <h2>${ev.title}</h2>
    <p class="lead">${intro}</p>

    el.onclick = ()=>{
      hideOv();
      const i = parseInt(el.dataset.i);
      const ch = ev.choices[i];
      startTask(ch, ev.id, i);
      // 目标类任务的特殊处理

    };
  });
}

function taskMeta(t){
  const o = t.obj;
  let s='';
  if(o.type==='burn') s='纵火 '+o.need+' 处';
  else if(o.type==='protect') s='守粮 '+o.need+' 堆';
  else if(o.type==='kill') s='斩 '+(o.eliteName||'目标');
  else if(o.type==='steal') s='取 '+o.item;
  else if(o.type==='escort') s='接人，带出去';
  else if(o.type==='clear') s='清场';
  return `目标：${s}　赏：名望+${t.reward.fame||0}`;
}

function postTaskInit(ch){
  const o = ch.task.obj;
  if(o.type==='kill' && o.boss){
    const bt = G.mobs.find(m=>m.boss===o.boss);
    if(bt){ bt.isTarget=true; addLog('要找的人在前头。','y'); }
    renderAll();
    return;
  }
  if(o.type==='kill'){
    let t = G.mobs.find(m=>m.type==='elite' && !m.dead);
    if(!t && G.mobs.length){
      const old = G.mobs.pop();
      t = mkMob('elite', old.x, old.y);
      G.mobs.push(t);
    }
    if(t){ t.isTarget=true; t.name=o.eliteName||'目标'; t.max=t.hp; }
    addLog('目标就在这座营里。','y');
  }
  if(o.type==='steal' || o.type==='escort'){
    addLog(o.type==='steal'? '东西在最深处。拿了走。':'人在最深处。接上就走。','y');
  }
  if(o.type==='protect'){
    addLog('粮食着不得。','y');
  }
  renderAll();
}

/* ===== 成长：经验驱动，不再按次数白送等级 ===== */
function expNeed(lv){ return 24 + (lv-1)*16; }

const GROWTH = {
  dagger:{hp:5, atk:2, def:1, eva:2, st:4},
  spear: {hp:9, atk:1, def:2, eva:1, st:6},
  bow:   {hp:6, atk:2, def:1, eva:1, st:5}
};

function growLevel(){
  const g = GROWTH[run.cls] || GROWTH.dagger;
  run.basehp += g.hp;
  run.maxhp = run.basehp + gearHp();
  run.hp = Math.min(run.maxhp, run.hp + Math.round(g.hp*0.7));
  run.atk += g.atk;
  run.def += g.def;
  run.eva += g.eva;
  run.stmax += g.st;
  run.st = run.stmax;
  run.resMax += 2;
  run.sp++;
}

function addExp(n){
  if(!run || !n) return;
  n = Math.round(n);
  run.exp = (run.exp||0) + n;
  run.lastGain = (run.lastGain||0) + n;
  let ups = 0;
  while(run.exp >= expNeed(run.lv)){
    run.exp -= expNeed(run.lv);
    run.lv++;
    growLevel();
    ups++;
  }
  if(ups) run.lastUps = (run.lastUps||0) + ups;
}

/* ===== 第五批：设置 / 元进度 / 存档 / 音效 ===== */
const SET_KEY='wmdk_set', META_KEY='wmdk_meta', SAVE_KEY='wmdk_save';
let SET = {vol:0.5, mute:false, speed:1, diff:'normal', challenge:false};
const DIFF = {
  easy:  {n:'轻松', hp:0.82, atk:0.86, exp:1.25},
  normal:{n:'标准', hp:1.00, atk:1.00, exp:1.00},
  hard:  {n:'苦战', hp:1.24, atk:1.14, exp:1.35}
};
function loadSet(){
  try{ const v=JSON.parse(localStorage.getItem(SET_KEY)||'{}');
    Object.keys(SET).forEach(k=>{ if(v[k]!==undefined) SET[k]=v[k]; });
  }catch(e){}
}
function saveSet(){ try{ localStorage.setItem(SET_KEY, JSON.stringify(SET)); }catch(e){} }

function blankMeta(){ return {codex:{}, gear:{}, events:{}, wins:{}, endings:{}, best:0}; }
function loadMeta(){
  const m=blankMeta();
  try{ const v=JSON.parse(localStorage.getItem(META_KEY)||'{}');
    Object.keys(m).forEach(k=>{ if(v[k]!==undefined) m[k]=v[k]; });
  }catch(e){}
  return m;
}
function saveMeta(m){ try{ localStorage.setItem(META_KEY, JSON.stringify(m)); }catch(e){} }
function metaAddMany(bucket, keys){
  const m=loadMeta(); m[bucket]=m[bucket]||{};
  let ch=false;
  (keys||[]).forEach(k=>{ if(k && !m[bucket][k]){ m[bucket][k]=1; ch=true; } });
  if(ch) saveMeta(m);
  return m;
}
function metaAdd(bucket, key){
  const m=loadMeta();
  m[bucket]=m[bucket]||{};
  if(m[bucket][key]) return m;
  m[bucket][key]=1;
  saveMeta(m);
  return m;
}
function metaWin(cls, endingKey){
  const m=loadMeta();
  m.wins[cls]=(m.wins[cls]||0)+1;
  m.endings[endingKey]=1;
  saveMeta(m);
  return m;
}
/* 解锁：只解锁"新内容/新选择"，不给累计属性 */
function unlocks(){
  const m=loadMeta();
  const won=Object.keys(m.wins||{}).length;
  const starters=[];
  if(won>=1) starters.push('huadao');
  if(m.codex['kill_dongzhuo']) starters.push('dongarmor');
  if(m.codex['kill_lvbu']) starters.push('fangtian');
  return {won, starters, challenge: won>=1, endings:Object.keys(m.endings||{}).length};
}

/* ---- 音效：纯合成，无外部素材 ---- */
let AC=null;
const SFX = {hit:[230,0.09,0.85], crit:[540,0.13,1], hurt:[150,0.15,0.7], fire:[330,0.2,0.55],
             win:[460,0.28,0.8], dead:[110,0.3,0.5], click:[700,0.04,0.4]};
function sfx(kind){
  if(SET.mute || !SET.vol) return;
  try{
    const W2 = window;
    if(!AC) AC = new (W2.AudioContext || W2.webkitAudioContext)();
    const pr = SFX[kind] || SFX.hit;
    const o=AC.createOscillator(), g=AC.createGain();
    o.type = (kind==='fire') ? 'sawtooth' : 'triangle';
    o.frequency.value = pr[0];
    g.gain.value = pr[2]*SET.vol;
    if(g.gain.exponentialRampToValueAtTime) g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+pr[1]);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+pr[1]);
  }catch(e){}
}

/* ---- 难度与挑战真正作用于敌人 ---- */
function applyDiff(o){
  const d = DIFF[SET.diff] || DIFF.normal;
  const k = SET.challenge ? {hp:d.hp*1.12, atk:d.atk*1.08, exp:d.exp*1.1} : d;
  (o.mobs||[]).forEach(m=>{
    if(m.rel!=='hostile') return;
    m.max = Math.max(6, Math.round(m.max*k.hp));
    m.hp = m.max;
    m.atk = Math.round(m.atk*k.atk*10)/10;
    m.expv = Math.round((m.expv||1)*k.exp);
  });
}
function diffName(){ const d=DIFF[SET.diff]||DIFF.normal; return d.n + (SET.challenge?' · 挑战':''); }

    return true;
  }catch(e){ return false; }
}

    W = snap.W; run = snap.run;
    const g = snap.G;
    G = {tiles:g.tiles, props:g.props||[], items:g.items||[], mobs:g.mobs||[],
      entry:g.entry, exit:g.exit, cfg:g.cfg, px:g.px, py:g.py,
      visible:Array.from({length:GH},()=>Array(GW).fill(false)),
      explored:g.explored||Array.from({length:GH},()=>Array(GW).fill(false)),
      alarm:g.alarm||0, turn:g.turn||0, over:false, atExit:g.atExit||false,
      obj:g.obj, objDone:g.objDone||0, reinforceTick:0, log:g.log||[],
      smoke:g.smoke||null, result:g.result||null, fx:[], toast:null};
    if(!G.log.length) G.log=[];
    UI.mode='move'; UI.pending=null; UI.cursor=null; UI.paused=false; UI.panel=null;
    const savedLog = G.log || [];
    hideOv(); clearLog();
    savedLog.forEach(l=>addLog(l.s!==undefined?l.s:l.t, l.c));
    computeFOV(); renderAll();
    return true;
  }catch(e){ return false; }
}

/* ===== 存档 ===== */
function loadCodex(){
  try{ return JSON.parse(localStorage.getItem('wmdk_codex')||'[]'); }catch(e){ return []; }
}
function saveCodex(c){
  try{ localStorage.setItem('wmdk_codex', JSON.stringify(c.slice(-40))); }catch(e){}
}

/* ===== 启动 ===== */
loadSet();
initWorld();
W.codex = loadCodex();

if(typeof requestAnimationFrame==='function'){
  const step=()=>{
    requestAnimationFrame(step);
    if(!G || UI.paused) return;
    renderCanvas();
  };
  requestAnimationFrame(step);
}

showTitle();
</script>
</body>
</html>
